<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>성가대 자료실</title>
<meta name="description" content="성가대 4성부 악보와 파트별 연습 자료">
<meta property="og:type" content="website">
<meta property="og:title" content="성가대 자료실">
<meta property="og:description" content="4성부 악보와 소프라노·알토·테너·베이스 연습 자료를 확인하세요.">
<meta property="og:image" content="https://worship-db-sable.vercel.app/assets/main-church-bg.png">
<meta name="twitter:card" content="summary_large_image">
<style>
:root{--gold:#d7b765;--gold2:#b99545;--bg:#050b16;--panel:rgba(7,13,25,.74);--panel2:rgba(255,255,255,.07);--line:rgba(255,255,255,.15);--muted:#c6cedd;--text:#f8fafc}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(90deg,rgba(2,6,16,.82),rgba(2,6,16,.52)),linear-gradient(180deg,rgba(0,0,0,.12),rgba(0,0,0,.72)),url("assets/main-church-bg.png");background-size:cover;background-position:left center;color:var(--text);font-family:'Noto Sans KR',system-ui,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
.wrap{max-width:1380px;margin:0 auto;padding:24px 18px 64px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
.brand{font-size:24px;font-weight:900;letter-spacing:-.04em}
.nav{display:flex;gap:8px;flex-wrap:wrap}
.nav a,.nav button,.btn{border:1px solid var(--line);background:rgba(5,10,18,.58);color:#fff;border-radius:999px;padding:11px 15px;font-weight:900;backdrop-filter:blur(14px)}
body.shared-view .nav{display:none}
.btn.primary,.nav .primary{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#07101f;border-color:rgba(255,255,255,.18)}
.hero{display:grid;grid-template-columns:minmax(280px,1fr) minmax(260px,420px);gap:16px;align-items:end;border:1px solid var(--line);background:var(--panel);border-radius:28px;padding:22px;margin-bottom:16px;backdrop-filter:blur(18px)}
h1{font-size:clamp(38px,6vw,70px);line-height:1.02;letter-spacing:-.055em;margin:0 0 12px}
p{margin:0;color:var(--muted);line-height:1.6}
.search{display:grid;grid-template-columns:1fr 180px 170px;gap:8px}
.search input,.search select,.edit-form input,.edit-form select,.edit-form textarea{width:100%;border:1px solid var(--line);background:rgba(255,255,255,.08);color:#fff;border-radius:15px;padding:13px;outline:none}
select option{color:#111}
.layout{display:grid;grid-template-columns:360px minmax(0,1fr);gap:16px}
.panel{border:1px solid var(--line);background:var(--panel);border-radius:24px;padding:16px;backdrop-filter:blur(18px)}
.panel h2{margin:0 0 12px;font-size:22px}
.list{display:grid;gap:9px;max-height:calc(100vh - 340px);overflow:auto;padding-right:4px}
.item{border:1px solid var(--line);background:rgba(255,255,255,.055);color:#fff;border-radius:17px;padding:13px;text-align:left}
.item.on{background:#fff;color:#07101f}
.item strong{display:block;font-size:18px;margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item span{font-size:13px;color:#aeb8ca}.item.on span{color:#475569}
.empty{border:1px dashed rgba(255,255,255,.22);border-radius:18px;padding:22px;text-align:center;color:#cbd5e1}
.detail-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px}
.detail-title{font-size:34px;font-weight:900;letter-spacing:-.05em}
.detail-sub{color:var(--muted);font-weight:800;margin-top:4px}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.part-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.part-tabs button{border:1px solid var(--line);background:rgba(255,255,255,.08);color:#fff;border-radius:999px;padding:9px 12px;font-weight:900}
.part-tabs button.on{background:#fff;color:#07101f}
.viewer-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.score-card,.media-card,.part-summary{border:1px solid var(--line);background:rgba(255,255,255,.055);border-radius:22px;padding:14px}
.main-viewer-card{width:100%;max-width:980px;margin:0 auto}
.score-toolbar,.media-toolbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.score-toolbar b,.media-toolbar b{font-size:18px}
.score-preview{height:min(62vh,680px);background:white;border-radius:18px;overflow:auto;display:flex;justify-content:center;align-items:flex-start;color:#64748b}
.score-preview img{display:block;width:100%;height:auto}
.score-preview .no-score{padding:44px 18px;color:#64748b;font-weight:900}
.media-body{border-radius:18px;background:#020617;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#cbd5e1}
.media-body.score-mode{height:min(58vh,560px);min-height:320px}
.media-body.video-mode{aspect-ratio:16/9;min-height:0}
.media-body img{display:block;max-width:100%;background:#fff;border-radius:14px;object-fit:contain}
.media-body iframe{width:100%;height:100%;aspect-ratio:16/9;border:0}
.score-spread{width:100%;height:100%;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;padding:12px;align-items:center}
.score-spread img{width:100%;height:100%;object-fit:contain}
.viewer-action-row{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;margin-top:10px}
.viewer-action-row .btn{display:flex;justify-content:center}
.memo{margin-top:12px;background:#020617;color:#f8fafc;border-radius:16px;padding:13px;font-weight:800;line-height:1.55}
.part-list{display:grid;gap:9px;margin-top:12px}
.part-row{display:grid;grid-template-columns:86px 1fr auto;align-items:center;gap:8px;border:1px solid var(--line);border-radius:15px;background:rgba(255,255,255,.055);padding:10px}
.part-row b{font-size:14px}.part-row span{font-size:12px;color:var(--muted)}
.order-chip{display:inline-flex;align-items:center;border:1px solid rgba(215,183,101,.32);background:rgba(183,146,65,.16);border-radius:999px;padding:4px 8px;color:#f8e7b2;font-size:12px;font-weight:900;margin-left:6px}
.small-btn{border:1px solid var(--line);background:rgba(255,255,255,.08);color:#fff;border-radius:999px;padding:8px 10px;font-size:13px;font-weight:900}
.small-btn.primary{background:#fff;color:#07101f}
.small-btn.subtle{font-size:12px;padding:7px 9px;opacity:.72}
.small-btn.danger{border-color:rgba(248,113,113,.42);background:rgba(127,29,29,.35)}
.viewer-action-row.with-secondary{grid-template-columns:minmax(0,1fr) auto auto}
.order-editor{border:1px solid rgba(215,183,101,.30);background:rgba(5,10,18,.48);border-radius:20px;padding:13px}
.order-editor summary{list-style:none;cursor:pointer;font-weight:900;color:#f8e7b2;display:flex;justify-content:space-between;gap:10px}
.order-editor summary::-webkit-details-marker{display:none}
.order-editor p{font-size:13px;margin:9px 0 0}
.order-columns{display:grid;grid-template-columns:minmax(220px,.8fr) minmax(0,1.2fr);gap:12px;margin-top:12px}
.order-box{border:1px solid var(--line);background:rgba(255,255,255,.055);border-radius:16px;padding:11px}
.order-box h3{font-size:14px;margin:0 0 8px}
.source-pages,.order-sequence{display:flex;gap:7px;flex-wrap:wrap}
.source-page,.sequence-chip{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.07);color:#fff;border-radius:14px;padding:8px 10px;font-size:12px;font-weight:900}
.source-page{display:grid;gap:5px;text-align:center}
.source-page button,.sequence-chip button{border:0;background:rgba(255,255,255,.12);color:#fff;border-radius:999px;padding:4px 7px;font-size:11px;font-weight:900}
.sequence-chip{display:flex;align-items:center;gap:5px}
.sequence-chip b{color:#f8e7b2}
.order-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.edit-panel{display:none;margin-top:14px}
.edit-panel.show{display:block}
.edit-form{display:grid;gap:10px}
.edit-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.file-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.file-grid label{border:1px solid var(--line);border-radius:15px;background:rgba(255,255,255,.055);padding:10px;font-weight:900;color:#e5e7eb}
.file-grid input{margin-top:8px;width:100%}
.viewer{position:fixed;inset:0;background:#020617;z-index:50;display:none;overflow:hidden;color:#fff}
.viewer.show{display:block}
.viewer-top,.viewer-bottom{position:fixed;left:0;right:0;z-index:3;display:flex;align-items:center;gap:8px;padding:10px 14px;background:rgba(2,6,16,.78);backdrop-filter:blur(14px)}
.viewer-top{top:0}.viewer-bottom{bottom:0}
.viewer-top .grow{flex:1}.viewer-stage{position:absolute;inset:62px 0 72px;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:16px;padding:8px}
.viewer-stage img{max-height:100%;max-width:calc(100vw - 32px);background:white;object-fit:contain}
.viewer.two .viewer-stage img{max-width:calc(50vw - 24px)}
.viewer-video{position:absolute;inset:72px 12px 76px;display:none;align-items:center;justify-content:center}
.viewer.video .viewer-stage{display:none}.viewer.video .viewer-video{display:flex}
.viewer-video iframe{width:min(1180px,96vw);aspect-ratio:16/9;border:0;background:#000;border-radius:18px}
.strip{display:flex;gap:8px;overflow:auto;flex:1}.strip button{white-space:nowrap}
@media(max-width:900px){.hero,.layout,.viewer-grid,.order-columns{grid-template-columns:1fr}.list{max-height:none}.score-preview{height:auto;max-height:none}.media-body.score-mode{height:54vh;min-height:300px}.media-body img{width:100%;max-width:100%}.score-spread{grid-template-columns:1fr}.score-spread img:nth-child(n+2){display:none}.top{align-items:flex-start}.detail-head{display:block}.actions{justify-content:flex-start;margin-top:12px}.part-row{grid-template-columns:74px 1fr}.part-row .small-btn{grid-column:1/-1}.viewer-action-row.with-secondary{grid-template-columns:1fr}.file-grid,.edit-grid{grid-template-columns:1fr}}
@media(max-width:680px){.search{grid-template-columns:1fr}.search input,.search select{min-height:48px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" id="brand-link" href="test-choir.html">성가대 자료실</a>
    <nav class="nav">
      <a class="home-link" href="index.html">초기화면</a>
      <a class="home-link" href="test-choir.html">성가대 홈</a>
      <a class="admin-link primary" href="choir-upload.html">성가곡 등록</a>
    </nav>
  </header>
  <section class="hero">
    <div>
      <h1>성가대 자료실</h1>
      <p>4성부 악보를 기본으로 보고, 소프라노·알토·테너·베이스 악보와 연습 영상을 한 화면에서 확인합니다.</p>
    </div>
    <div class="search">
      <input id="q" placeholder="악보 이름으로 검색" oninput="renderList()">
      <select id="kind" onchange="renderList()">
        <option value="all">전체</option>
        <option value="service">이번 주일 할 곡</option>
        <option value="practice">앞으로 연습할 곡</option>
        <option value="archive">자료만 보관</option>
      </select>
      <select id="sort" onchange="renderList()">
        <option value="date">날짜순</option>
        <option value="practice">연습곡 먼저</option>
        <option value="title">이름순</option>
      </select>
    </div>
  </section>

  <div class="layout">
    <section class="panel">
      <h2>성가곡 목록</h2>
      <div id="list" class="list"><div class="empty">자료를 불러오는 중입니다.</div></div>
    </section>
    <section class="panel">
      <div id="detail" class="empty">왼쪽에서 성가곡을 선택하세요.</div>
    </section>
  </div>
</div>

<div id="viewer" class="viewer" tabindex="0">
  <div class="viewer-top">
    <button class="small-btn primary" onclick="setViewerPages(1)">1장보기</button>
    <button class="small-btn" onclick="setViewerPages(2)">2장보기</button>
    <button class="small-btn" onclick="setViewerMode('score')">악보</button>
    <button class="small-btn" onclick="setViewerMode('video')">영상</button>
    <div class="grow" id="viewer-title"></div>
    <button class="small-btn" onclick="closeViewer()">닫기</button>
  </div>
  <div id="viewer-stage" class="viewer-stage"></div>
  <div id="viewer-video" class="viewer-video"></div>
  <div class="viewer-bottom">
    <button class="small-btn" onclick="viewerPrev()">이전</button>
    <div id="viewer-strip" class="strip"></div>
    <button class="small-btn" onclick="viewerNext()">다음</button>
  </div>
</div>

<script>
let choirSongs=[], selectedId='', selectedPart='full', mediaMode='score', orderDraft=[];
let viewerState={song:null,part:'full',page:0,pages:1,mode:'score',useOrder:false,wake:null,touchX:0};
const sharedView=new URLSearchParams(location.search).get('shared')==='1'||new URLSearchParams(location.search).get('view')==='shared';
const labels={service:'이번 주일 할 곡',practice:'앞으로 연습할 곡',archive:'자료만 보관'};
const partLabels={full:'4성부',soprano:'소프라노',alto:'알토',tenor:'테너',bass:'베이스'};
const partOrder=['full','soprano','alto','tenor','bass'];
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function norm(v){return String(v||'').replace(/\s+/g,'').toLowerCase()}
function songById(id){return choirSongs.find(song=>song.id===id)}
function pagesOf(song,part=selectedPart){return song?.scores?.[part]||[]}
function safeOrderMap(value){return value && typeof value === 'object' ? value : {}}
function orderOf(song,part=selectedPart){
  const orderMap=safeOrderMap(song?.score_order);
  return Array.isArray(orderMap[part]) ? orderMap[part] : [];
}
function sequencedPagesOf(song,part=selectedPart){
  const pages=pagesOf(song,part);
  const order=orderOf(song,part).filter(pageNo=>pageNo>=1 && pageNo<=pages.length);
  if(!order.length) return pages.map((file,index)=>({...file,source_page_no:index+1,sequence_no:index+1,sequence_total:pages.length}));
  return order.map((pageNo,index)=>({...pages[pageNo-1],source_page_no:pageNo,sequence_no:index+1,sequence_total:order.length}));
}
function originalPagesOf(song,part=selectedPart){
  const pages=pagesOf(song,part);
  return pages.map((file,index)=>({...file,source_page_no:index+1,sequence_no:index+1,sequence_total:pages.length}));
}
function cleanOrder(song,part,order){
  const max=pagesOf(song,part).length;
  return (Array.isArray(order)?order:[]).map(Number).filter(pageNo=>Number.isInteger(pageNo)&&pageNo>=1&&pageNo<=max).slice(0,200);
}
function draftBase(song,part=selectedPart){
  const saved=cleanOrder(song,part,orderOf(song,part));
  if(saved.length) return saved;
  return pagesOf(song,part).map((_,index)=>index+1);
}
function videoOf(song,part=selectedPart){return part==='full' ? song?.videos?.full : song?.videos?.[part]}
function youtubeEmbed(url){
  const raw=String(url||'').trim(); if(!raw)return '';
  const m=raw.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([a-zA-Z0-9_-]{6,})/);
  return m ? `https://www.youtube.com/embed/${m[1]}?rel=0` : raw;
}
async function loadChoir(){
  try{
    const res=await fetch('/api/r2-choir-upload',{cache:'no-store'});
    const text=await res.text();
    let data={};
    try{data=text?JSON.parse(text):{};}catch(_){data={error:text};}
    const localStatic=/^(localhost|127\.0\.0\.1)$/i.test(location.hostname) && (res.status===404 || res.status===501 || String(text).trim().startsWith('<!DOCTYPE'));
    if(localStatic) throw new Error('로컬 미리보기에서는 성가대 목록 API가 실행되지 않습니다. 운영 주소에서 자료실을 확인해주세요.');
    if(!res.ok || !data.ok) throw new Error(data.error || '목록을 불러오지 못했습니다.');
    const groups=Array.isArray(data.manifest) ? data.manifest : (data.manifest?.groups || []);
    choirSongs=groups.filter(item=>item && item.type==='choir_song');
    renderList();
  }catch(e){
    document.getElementById('list').innerHTML=`<div class="empty">${esc(e.message||e)}</div>`;
  }
}
function filtered(){
  const q=norm(document.getElementById('q').value);
  const kind=document.getElementById('kind').value;
  const sort=document.getElementById('sort').value;
  const typeRank={service:0,practice:1,archive:2};
  return choirSongs.filter(song=>{
    const okTitle=!q || norm(song.title).includes(q) || norm(song.search_title).includes(q);
    const okKind=kind==='all' || song.schedule?.type===kind;
    return okTitle && okKind;
  }).sort((a,b)=>{
    if(sort==='title') return String(a.title||'').localeCompare(String(b.title||''),'ko');
    if(sort==='practice'){
      const rank=(typeRank[a.schedule?.type]??9)-(typeRank[b.schedule?.type]??9);
      if(rank)return rank;
    }
    const date=String(a.schedule?.date||'9999').localeCompare(String(b.schedule?.date||'9999'));
    return date || String(a.title||'').localeCompare(String(b.title||''),'ko');
  });
}
function renderList(){
  const list=filtered();
  const box=document.getElementById('list');
  if(!list.length){box.innerHTML='<div class="empty">등록된 성가곡이 없습니다.</div>';document.getElementById('detail').innerHTML='<div class="empty">성가곡을 등록하면 이곳에 표시됩니다.</div>';return}
  if(!selectedId || !list.some(item=>item.id===selectedId)) selectedId=list[0].id;
  box.innerHTML=list.map(song=>`<button class="item ${song.id===selectedId?'on':''}" onclick="selectSong('${esc(song.id)}')"><strong>${esc(song.title)}</strong><span>${esc(song.schedule?.date||'날짜 미정')} · ${esc(labels[song.schedule?.type]||song.schedule?.type||'자료')} · 악보 ${song.files?.length||0}장</span></button>`).join('');
  renderDetail(songById(selectedId));
}
function selectSong(id){selectedId=id;selectedPart='full';mediaMode='score';orderDraft=[];renderList()}
function setPart(part){selectedPart=part;mediaMode='score';orderDraft=[];renderDetail(songById(selectedId))}
function setMedia(mode){mediaMode=mode;renderDetail(songById(selectedId))}
function renderScorePreview(song){
  const pages=originalPagesOf(song);
  if(!pages.length) return '<div class="no-score">이 성부에 등록된 악보가 없습니다.</div>';
  return `<div class="score-spread">${pages.slice(0,2).map((page,idx)=>`<img src="${esc(page.url)}" alt="${esc(song.title)} ${esc(partLabels[selectedPart])} 원본 ${idx+1}쪽">`).join('')}</div>`;
}
function renderMedia(song){
  if(mediaMode==='video'){
    const url=youtubeEmbed(videoOf(song));
    return url ? `<iframe src="${esc(url)}" allowfullscreen></iframe>` : '<div>이 성부에 등록된 영상이 없습니다.</div>';
  }
  return renderScorePreview(song);
}
function renderPartRows(song){
  return partOrder.map(part=>{
    const count=pagesOf(song,part).length;
    const order=orderOf(song,part).filter(pageNo=>pageNo>=1 && pageNo<=count);
    const hasVideo=!!videoOf(song,part);
    return `<div class="part-row"><b>${partLabels[part]}</b><span>원본 ${count}장 · 영상 ${hasVideo?'있음':'없음'}${order.length?` · 반주용 ${order.length}단계 <span class="order-chip">${esc(order.join('-'))}</span>`:''}</span><button class="small-btn ${part===selectedPart?'primary':''}" onclick="setPart('${part}')">보기</button></div>`;
  }).join('');
}
function renderOrderEditor(song){
  if(sharedView) return '';
  const pages=originalPagesOf(song,selectedPart);
  if(!pages.length) return '';
  if(!orderDraft.length) orderDraft=draftBase(song,selectedPart);
  const saved=orderOf(song,selectedPart).filter(pageNo=>pageNo>=1&&pageNo<=pages.length);
  return `<details class="order-editor">
    <summary><span>반주용 순서 편집</span><span>${saved.length?'저장됨':'원본 순서 사용 중'}</span></summary>
    <p>원본 악보는 그대로 두고, 반주용 악보에서만 페이지를 복사하거나 순서를 바꿉니다. 일반 성가대원은 원본 악보를 크게 보면 됩니다.</p>
    <div class="order-columns">
      <div class="order-box">
        <h3>원본 페이지</h3>
        <div class="source-pages">${pages.map(page=>`<div class="source-page"><b>${page.source_page_no}쪽</b><button type="button" onclick="appendOrderPage(${page.source_page_no})">복사 추가</button></div>`).join('')}</div>
      </div>
      <div class="order-box">
        <h3>반주용 순서</h3>
        <div class="order-sequence">${orderDraft.map((pageNo,index)=>`<div class="sequence-chip"><span>${index+1}</span><b>원본 ${pageNo}</b><button type="button" onclick="moveOrderStep(${index},-1)">←</button><button type="button" onclick="moveOrderStep(${index},1)">→</button><button type="button" onclick="removeOrderStep(${index})">제거</button></div>`).join('') || '<div class="empty">반주용 순서가 비어 있습니다.</div>'}</div>
        <div class="order-actions">
          <button class="small-btn primary" type="button" onclick="saveScoreOrder()">반주용 순서 저장</button>
          <button class="small-btn" type="button" onclick="resetOrderDraft()">원본 순서로</button>
          <button class="small-btn danger" type="button" onclick="clearScoreOrder()">반주용 삭제</button>
        </div>
      </div>
    </div>
  </details>`;
}
function renderDetail(song){
  if(!song){document.getElementById('detail').innerHTML='<div class="empty">왼쪽에서 성가곡을 선택하세요.</div>';return}
  const partTabs=partOrder.map(part=>`<button class="${part===selectedPart?'on':''}" onclick="setPart('${part}')">${partLabels[part]}</button>`).join('');
  const currentModeLabel=mediaMode==='video'?'영상':'악보';
  const openMode=mediaMode==='video'?'video':'score';
  document.getElementById('detail').innerHTML=`
    <div class="detail-head">
      <div><div class="detail-title">${esc(song.title)}</div><div class="detail-sub">${esc(song.schedule?.date||'날짜 미정')} · ${esc(labels[song.schedule?.type]||song.schedule?.type||'자료')}</div></div>
      ${sharedView?'':`<div class="actions">
        <a class="btn" href="test-choir.html">성가대 홈</a>
        <a class="btn" href="index.html">초기화면</a>
        <a class="btn primary" href="choir-upload.html?id=${encodeURIComponent(song.id)}">수정</a>
      </div>`}
    </div>
    <div class="part-tabs">${partTabs}</div>
    <div class="viewer-grid">
      <div class="media-card main-viewer-card">
        <div class="media-toolbar">
          <b>${partLabels[selectedPart]} ${currentModeLabel}</b>
          <div><button class="small-btn ${mediaMode==='score'?'primary':''}" onclick="setMedia('score')">악보</button> <button class="small-btn ${mediaMode==='video'?'primary':''}" onclick="setMedia('video')">영상</button></div>
        </div>
        <div class="media-body ${mediaMode==='video'?'video-mode':'score-mode'}">${renderMedia(song)}</div>
        <div class="viewer-action-row with-secondary">
          <button class="btn primary" onclick="openViewer('${selectedPart}','score',false)">원본 악보 크게 보기</button>
          ${orderOf(song,selectedPart).length?`<button class="small-btn subtle" onclick="openViewer('${selectedPart}','score',true)">반주용 악보</button>`:''}
          ${mediaMode==='video'?`<button class="small-btn primary" onclick="openViewer('${selectedPart}','${openMode}',false)">영상 크게 보기</button>`:''}
        </div>
      </div>
      ${renderOrderEditor(song)}
      <div class="part-summary">
        <b>성부별 자료</b>
        <div class="part-list">${renderPartRows(song)}</div>
      </div>
      ${song.memo ? `<div class="memo">${esc(song.memo)}</div>` : '<div class="memo">등록된 메모가 없습니다.</div>'}
    </div>`;
}
async function keepAwake(on){
  try{
    if(on && navigator.wakeLock && !viewerState.wake) viewerState.wake=await navigator.wakeLock.request('screen');
    if(!on && viewerState.wake){await viewerState.wake.release();viewerState.wake=null;}
  }catch(_){}
}
function openViewer(part,mode='score',useOrder=false){
  const song=songById(selectedId); if(!song)return;
  viewerState={...viewerState,song,part,page:0,mode,pages:1,useOrder:!!useOrder};
  document.getElementById('viewer').className='viewer show';
  setViewerMode(mode);
  renderViewer();
  keepAwake(true);
}
function closeViewer(){
  document.getElementById('viewer').className='viewer';
  document.getElementById('viewer-video').innerHTML='';
  keepAwake(false);
}
function setViewerPages(n){viewerState.pages=n;renderViewer()}
function setViewerMode(mode){viewerState.mode=mode;renderViewer()}
function viewerPrev(){viewerState.page=Math.max(0,viewerState.page-1);renderViewer()}
function viewerPages(){return viewerState.useOrder ? sequencedPagesOf(viewerState.song,viewerState.part) : originalPagesOf(viewerState.song,viewerState.part)}
function viewerNext(){const max=Math.max(0,viewerPages().length-1);viewerState.page=Math.min(max,viewerState.page+1);renderViewer()}
function renderViewer(){
  const viewer=document.getElementById('viewer');
  if(!viewer.classList.contains('show')||!viewerState.song)return;
  viewer.className=`viewer show ${viewerState.pages===2?'two':''} ${viewerState.mode==='video'?'video':''}`;
  const pages=viewerPages();
  const max=Math.max(0,pages.length-1);
  viewerState.page=Math.min(viewerState.page,max);
  const current=pages[viewerState.page];
  const label=viewerState.useOrder?'반주용 악보':'원본 악보';
  document.getElementById('viewer-title').textContent=`${viewerState.song.title} · ${partLabels[viewerState.part]} · ${label} · ${current?`${current.sequence_no}/${current.sequence_total} · 원본 ${current.source_page_no}쪽`:''}`;
  const imgs=pages.slice(viewerState.page,viewerState.page+viewerState.pages).map(file=>`<img src="${esc(file.url)}" alt="${esc(file.file_name||'악보')} ${label} ${file.sequence_no} · 원본 ${file.source_page_no}쪽">`).join('');
  document.getElementById('viewer-stage').innerHTML=imgs || '<div class="empty">등록된 악보가 없습니다.</div>';
  const video=youtubeEmbed(videoOf(viewerState.song,viewerState.part));
  document.getElementById('viewer-video').innerHTML=video ? `<iframe src="${esc(video)}" allowfullscreen></iframe>` : '<div class="empty">등록된 영상이 없습니다.</div>';
  document.getElementById('viewer-strip').innerHTML=partOrder.map(part=>`<button class="small-btn ${part===viewerState.part?'primary':''}" onclick="viewerState.part='${part}';viewerState.page=0;renderViewer()">${partLabels[part]}</button>`).join('');
}
function appendOrderPage(pageNo){orderDraft.push(pageNo);renderDetail(songById(selectedId))}
function moveOrderStep(index,dir){const next=index+dir;if(next<0||next>=orderDraft.length)return;[orderDraft[index],orderDraft[next]]=[orderDraft[next],orderDraft[index]];renderDetail(songById(selectedId))}
function removeOrderStep(index){orderDraft.splice(index,1);renderDetail(songById(selectedId))}
function resetOrderDraft(){const song=songById(selectedId);orderDraft=draftBase(song,selectedPart);renderDetail(song)}
function readChoirToken(){
  const token=prompt('반주용 순서 저장용 관리자 토큰을 입력해주세요.')||'';
  if(token){sessionStorage.setItem('worshipR2SyncToken',token);localStorage.setItem('worshipR2SyncToken',token)}
  return token;
}
async function postScoreOrder(order,retry=false){
  const token=(sessionStorage.getItem('worshipR2SyncToken')||localStorage.getItem('worshipR2SyncToken')||'').trim();
  const headers={'Content-Type':'application/json'};
  if(token) headers['x-r2-sync-token']=token;
  const res=await fetch('/api/r2-choir-upload',{method:'POST',headers,body:JSON.stringify({mode:'score-order',id:selectedId,section:selectedPart,order})});
  const data=await res.json().catch(()=>({}));
  if(res.status===401 && !retry){
    readChoirToken();
    return postScoreOrder(order,true);
  }
  if(!res.ok || !data.ok) throw new Error(data.error || '반주용 순서를 저장하지 못했습니다.');
  return data.group;
}
async function saveScoreOrder(){
  const song=songById(selectedId);
  if(!song)return;
  const clean=cleanOrder(song,selectedPart,orderDraft);
  try{
    const group=await postScoreOrder(clean);
    const idx=choirSongs.findIndex(item=>item.id===group.id);
    if(idx>=0) choirSongs[idx]=group;
    orderDraft=[];
    renderList();
    alert('반주용 순서를 저장했습니다.');
  }catch(e){alert(e.message||e)}
}
async function clearScoreOrder(){
  if(!confirm('이 성부의 반주용 순서만 삭제할까요? 원본 악보는 그대로 유지됩니다.'))return;
  orderDraft=[];
  try{
    const group=await postScoreOrder([]);
    const idx=choirSongs.findIndex(item=>item.id===group.id);
    if(idx>=0) choirSongs[idx]=group;
    renderList();
    alert('반주용 순서를 삭제했습니다.');
  }catch(e){alert(e.message||e)}
}
document.getElementById('viewer').addEventListener('touchstart',e=>{viewerState.touchX=e.touches[0].clientX},{passive:true});
document.getElementById('viewer').addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-viewerState.touchX;if(Math.abs(dx)>45){dx<0?viewerNext():viewerPrev()}},{passive:true});
document.addEventListener('keydown',e=>{if(!document.getElementById('viewer').classList.contains('show'))return;if(e.key==='Escape')closeViewer();if(e.key==='ArrowRight')viewerNext();if(e.key==='ArrowLeft')viewerPrev();});
if(sharedView){
  document.body.classList.add('shared-view');
  document.querySelectorAll('.admin-link,.home-link').forEach(el=>el.remove());
  const brand=document.getElementById('brand-link');
  if(brand)brand.removeAttribute('href');
}
loadChoir();
</script>
</body>
</html>
