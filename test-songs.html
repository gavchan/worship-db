<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>찬양곡 데이터베이스</title><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="test-site.css"></head>
<body><div class="test-page"><header class="top"><a class="brand" href="test-main.html">드림찬양단</a><nav class="nav"><a href="test-main.html">찬양단 홈</a><a href="test-conti.html">찬양콘티</a><a class="on" href="test-songs.html">찬양곡</a><a href="test-tools.html">관리도구</a><a href="index.html">통합 홈</a></nav></header>
<main class="wrap"><div class="eyebrow">✦ 곡 검색 · 악보 · 영상</div><h1>찬양곡 데이터베이스</h1><p class="lead">곡을 선택하면 왼쪽에서 정보와 수정 동선을 확인하고, 오른쪽에서 악보와 영상을 바로 봅니다.</p><div class="mobile-note">휴대폰에서는 곡 목록을 빠르게 훑고, 필요한 곡 하나를 눌러 악보·영상만 확인하는 방식으로 사용합니다.</div><div class="search"><input id="q" placeholder="곡 제목 검색" oninput="render()"></div><div class="songs-workspace"><section class="songs-left"><section class="song-detail show" id="song-detail"><div class="song-detail-head"><div><div class="song-detail-title" id="detail-title">곡 선택</div><div class="song-detail-sub" id="detail-sub">왼쪽 목록에서 곡을 선택하세요.</div></div></div><div class="song-info-grid" id="detail-grid"></div><form class="song-edit-form" id="song-edit-form" onsubmit="saveSongEdit(event)"></form><div class="btn-row" id="detail-actions"></div></section><div class="song-list" id="cards"></div></section><section class="song-media-panel"><div class="song-media-head"><div><b id="media-title">악보 미리보기</b><span id="media-sub">곡을 선택하면 악보가 표시됩니다.</span></div><div class="view-actions"><button class="mini-btn primary" id="score-btn" onclick="setMediaMode('score')">악보</button><button class="mini-btn" id="video-btn" onclick="setMediaMode('video')">영상</button></div></div><div class="song-media-body" id="media-body"><div class="empty-preview">곡을 선택해주세요.</div></div></section></div></main></div>
<script>
const SUPABASE_URL='https://rmtysrytveexshwzenxj.supabase.co';const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJtdHlzcnl0dmVleHNod3plbnhqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY1MjQ3OTYsImV4cCI6MjA5MjEwMDc5Nn0.5FzzJ1rg-uRG4jAGZ75xVT3i3NH0m6J_tDeOS4GxyT8';const STORAGE_URL=SUPABASE_URL+'/storage/v1';const HEADERS={apikey:KEY,Authorization:`Bearer ${KEY}`};let songs=[],shownSongs=[],selectedSong=null,mediaMode='score',scoreCache={},versionRows=[],historyRows=[],manageTab='basic';
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const norm=v=>String(v||'').replace(/\s+/g,'').toLowerCase();
function youtubeId(url){const u=String(url||'').trim();if(!u)return'';let m=u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/|live\/))([A-Za-z0-9_-]{6,})/);if(m)return m[1];try{return new URL(u).searchParams.get('v')||''}catch(e){return''}}
function youtubeEmbed(url){const id=youtubeId(url);return id?`https://www.youtube.com/embed/${id}?rel=0&modestbranding=1&playsinline=1`:''}
function keyText(s){return s.key||s.score_key||s.song_key||'미정'}
function bpmText(s){return s.bpm||s.bpm_min||s.tempo||'미정'}
function statusText(s){return s.status==='ready'||s.has_score?'악보 완료':s.status==='plan'?'작업 예정':'사용 가능'}
function tagText(v){return Array.isArray(v)?v.join(', '):(v||'없음')}
function render(){const q=norm(document.getElementById('q').value);shownSongs=songs.filter(s=>!q||norm(s.name).includes(q)).slice(0,30);document.getElementById('cards').innerHTML=shownSongs.map((s,i)=>{const on=selectedSong&&String(selectedSong.id)===String(s.id);const card=`<button class="tile song-list-item ${on?'on':''}" type="button" onclick="openSongDetail(${i})"><b>${esc(s.name)}</b><span>Key ${esc(keyText(s))} · BPM ${esc(bpmText(s))}<br>${s.has_score?'악보 연결됨':'악보 준비중'} · ${s.music_url?'영상 있음':'영상 없음'}</span></button>`;const inline=on?`<section class="mobile-song-inline" id="mobile-song-inline"><div class="mobile-inline-head"><div><b>${esc(s.name||'곡')}</b><span>Key ${esc(keyText(s))} · BPM ${esc(bpmText(s))} · ${esc(statusText(s))}</span></div><div class="view-actions"><button class="mini-btn ${mediaMode==='score'?'primary':''}" id="mobile-score-btn" type="button" onclick="setMediaMode('score')">악보</button><button class="mini-btn ${mediaMode==='video'?'primary':''}" id="mobile-video-btn" type="button" onclick="setMediaMode('video')">영상</button></div></div><div class="mobile-inline-body" id="mobile-media-body"><div class="empty-preview">불러오는 중입니다.</div></div><div class="mobile-inline-note">휴대폰에서는 확인 위주로 사용하고, 수정·업로드는 큰 화면에서 작업하는 편이 좋습니다.</div></section>`:'';return card+inline}).join('')||'<div class="card" style="padding:22px">검색 결과가 없습니다.</div>'}
function scoreUrl(path){return `${STORAGE_URL}/object/public/scores/${encodeURIComponent(path).replaceAll('%2F','/')}`}
function isScoreImagePath(path){return /\.(png|jpe?g|webp|gif)$/i.test(String(path||''))}
async function api(path){const res=await fetch(`${SUPABASE_URL}/rest/v1/${path}`,{headers:HEADERS});if(!res.ok)throw new Error(await res.text());return await res.json()}
async function rest(method,path,body){const res=await fetch(`${SUPABASE_URL}/rest/v1/${path}`,{method,headers:{...HEADERS,'Content-Type':'application/json','Prefer':'return=representation'},body:JSON.stringify(body||{})});if(!res.ok)throw new Error(await res.text());return res.status===204?null:await res.json()}
async function patchSong(id,payload){const res=await fetch(`${SUPABASE_URL}/rest/v1/songs?id=eq.${encodeURIComponent(id)}`,{method:'PATCH',headers:{'Content-Type':'application/json',apikey:KEY,Authorization:`Bearer ${KEY}`,'Prefer':'return=representation'},body:JSON.stringify(payload)});if(!res.ok)throw new Error(await res.text());return await res.json()}
async function listScores(songId){if(!songId)return[];if(scoreCache[songId])return scoreCache[songId];try{const rows=await api(`song_score_files?select=storage_path,file_name,page_no&song_id=eq.${encodeURIComponent(songId)}&order=page_no.asc,created_at.asc`);scoreCache[songId]=(rows||[]).filter(r=>isScoreImagePath(r.storage_path));return scoreCache[songId]}catch(e){scoreCache[songId]=[];return[]}}
function setMediaMode(mode){mediaMode=mode==='video'?'video':'score';renderMedia()}
async function loadSongVersions(){if(!selectedSong?.id){versionRows=[];return}try{versionRows=await api(`song_score_versions?select=*&song_id=eq.${encodeURIComponent(selectedSong.id)}&order=is_default.desc,created_at.asc`)}catch(e){versionRows=[]}}
async function openSongDetail(i){const s=shownSongs[i];if(!s)return;selectedSong=s;mediaMode='score';await loadSongVersions();render();renderSongInfo();renderMedia()}
function renderSongInfo(){const s=selectedSong;if(!s)return;document.getElementById('detail-title').textContent=s.name||'곡 정보';document.getElementById('detail-sub').textContent=`Key ${keyText(s)} · BPM ${bpmText(s)} · ${statusText(s)}`;document.getElementById('song-edit-form').classList.remove('show');document.getElementById('detail-grid').innerHTML=[
  ['Key',keyText(s)],['BPM',bpmText(s)],['상태',statusText(s)],['사용횟수',s.count||s.usage_count||'미정'],['상황',tagText(s.situations||s.situation)],['절기',tagText(s.seasons||s.season)],['메모',s.memo||s.note||'없음']
].map(([k,v])=>`<div class="song-info-cell"><small>${esc(k)}</small><b>${esc(v)}</b></div>`).join('');const songParam=encodeURIComponent(s.name||'');const idParam=encodeURIComponent(s.id||'');document.getElementById('detail-actions').innerHTML=`<button class="btn primary" type="button" onclick="setMediaMode('score')">악보 보기</button><button class="btn" type="button" onclick="setMediaMode('video')">영상 보기</button><button class="btn" type="button" onclick="openEditForm()">수정/관리</button><a class="btn" href="score-upload.html?song=${songParam}&songId=${idParam}">악보 등록</a><a class="btn" href="score-version-manager.html?songId=${idParam}">버전 관리</a>`}
function splitHistoryNote(note){return String(note||'').replace(/\s*\[\[WDB_CONTI2:[A-Za-z0-9_-]+\]\]\s*/,'').trim()}
function renderVersionList(){const box=document.getElementById('version-list');if(!box)return;box.innerHTML=versionRows.length?versionRows.map(v=>`<div class="version-row"><b>${esc(v.version_name||'기본')} ${v.is_default?'대표':''}</b><span>Key ${esc(v.score_key||keyText(selectedSong))} · ${esc(v.score_type||'코드악보')} · ${esc(v.memo||'메모 없음')}</span></div>`).join(''):'<div class="empty-line">등록된 악보 버전이 없습니다. 아래에서 새 버전을 추가하세요.</div>'}
function memoHistoryRows(){const s=selectedSong;if(!s)return[];const rows=[];const push=(label,text)=>{const t=String(text||'').trim();if(t&&!rows.some(r=>r.text===t))rows.push({label,text:t})};push('찬양곡 기본 메모',s.memo||s.note);const id=String(s.id||'');const name=norm(s.name||'');(historyRows||[]).forEach(h=>{const ids=(h.song_ids||[]).map(x=>String(x));const names=(h.song_names||[]).map(x=>norm(x));if((id&&ids.includes(id))||(name&&names.includes(name)))push(`${h.worship_date||'날짜 없음'} 콘티 메모`,splitHistoryNote(h.note||h.memo||''))});return rows}
function showMemoHistory(){const box=document.getElementById('song-memo-history');if(!box)return;const rows=memoHistoryRows();box.style.display='block';box.innerHTML=rows.length?rows.map((r,i)=>`<button type="button" class="memo-history-item" onclick="useMemoHistory(${i})"><small>${esc(r.label)}</small>${esc(r.text)}</button>`).join(''):'<div class="empty-line">불러올 수 있는 이전 메모가 없습니다.</div>'}
function useMemoHistory(i){const row=memoHistoryRows()[i];if(row)document.getElementById('edit-memo').value=row.text}
function openEditForm(tab='basic'){const s=selectedSong;if(!s)return;manageTab=tab;const form=document.getElementById('song-edit-form');const tabs=`<div class="manage-tabs"><button type="button" class="${manageTab==='basic'?'on':''}" onclick="openEditForm('basic')">기본정보</button><button type="button" class="${manageTab==='memo'?'on':''}" onclick="openEditForm('memo')">메모</button><button type="button" class="${manageTab==='version'?'on':''}" onclick="openEditForm('version')">악보버전</button></div>`;let body='';if(manageTab==='basic')body=`<label>곡명<input id="edit-name" value="${esc(s.name||'')}"></label><div class="song-edit-two"><label>Key<input id="edit-key" value="${esc(keyText(s)==='미정'?'':keyText(s))}"></label><label>BPM<input id="edit-bpm" type="number" value="${esc(bpmText(s)==='미정'?'':bpmText(s))}"></label></div><label>상태<select id="edit-status"><option value="used">사용 가능</option><option value="ready">악보 완료</option><option value="plan">작업 예정</option></select></label><label>영상 링크<input id="edit-url" value="${esc(s.music_url||'')}"></label><div class="btn-row"><button class="btn primary" type="submit">기본정보 저장</button><button class="btn" type="button" onclick="document.getElementById('song-edit-form').classList.remove('show')">닫기</button></div>`;if(manageTab==='memo')body=`<label>메모<div class="memo-tools"><button class="mini-btn" type="button" onclick="showMemoHistory()">이전 메모 불러오기</button></div><div class="memo-history-box" id="song-memo-history"></div><textarea id="edit-memo">${esc(s.memo||s.note||'')}</textarea></label><div class="btn-row"><button class="btn primary" type="submit">메모 저장</button><button class="btn" type="button" onclick="document.getElementById('song-edit-form').classList.remove('show')">닫기</button></div>`;if(manageTab==='version')body=`<div class="version-manage-box"><div class="mini-head"><b>악보 버전 관리</b><span>다른 Key·전주·편곡 악보용</span></div><div id="version-list" class="version-list"></div><div class="song-edit-two"><label>버전명<input id="new-version-name" placeholder="예: 기본, 전주1, G 코드"></label><label>Key<input id="new-version-key" value="${esc(keyText(s)==='미정'?'':keyText(s))}"></label></div><div class="song-edit-two"><label>BPM<input id="new-version-bpm" type="number" value="${esc(bpmText(s)==='미정'?'':bpmText(s))}"></label><label>종류<input id="new-version-type" value="코드악보"></label></div><label>버전 메모<textarea id="new-version-memo" placeholder="예: 2페이지, 전주 포함, 여성키"></textarea></label><div class="btn-row"><button class="btn primary" type="button" onclick="createSongVersion()">다른 버전 추가</button><button class="btn" type="button" onclick="document.getElementById('song-edit-form').classList.remove('show')">닫기</button></div></div>`;form.innerHTML=tabs+body;if(document.getElementById('edit-status'))document.getElementById('edit-status').value=s.status||'used';form.classList.add('show');renderVersionList()}
async function saveSongEdit(e){e.preventDefault();const s=selectedSong;if(!s?.id)return alert('저장할 곡을 선택해주세요.');let payload={};if(manageTab==='basic')payload={name:document.getElementById('edit-name').value.trim(),key:document.getElementById('edit-key').value.trim(),bpm:Number(document.getElementById('edit-bpm').value||0),status:document.getElementById('edit-status').value,music_url:document.getElementById('edit-url').value.trim()};else if(manageTab==='memo')payload={memo:document.getElementById('edit-memo').value.trim()};else return;try{const rows=await patchSong(s.id,payload);const updated=rows?.[0]||{...s,...payload};Object.assign(s,updated);const idx=songs.findIndex(x=>String(x.id)===String(s.id));if(idx>=0)songs[idx]=s;selectedSong=s;render();renderSongInfo();openEditForm(manageTab);renderMedia();alert('저장했습니다.')}catch(err){alert('저장 실패: '+err.message)}}
async function createSongVersion(){const s=selectedSong;if(!s?.id)return alert('곡을 먼저 선택해주세요.');const payload={song_id:s.id,version_name:document.getElementById('new-version-name').value.trim()||'기본',score_key:document.getElementById('new-version-key').value.trim()||keyText(s),score_type:document.getElementById('new-version-type').value.trim()||'코드악보',bpm_min:Number(document.getElementById('new-version-bpm').value||0)||null,bpm_max:Number(document.getElementById('new-version-bpm').value||0)||null,is_default:versionRows.length===0,memo:document.getElementById('new-version-memo').value.trim()};try{await rest('POST','song_score_versions',payload);await loadSongVersions();renderVersionList();alert('다른 버전을 추가했습니다.')}catch(err){alert('버전 추가 실패: '+err.message)}}
async function renderMedia(){const s=selectedSong;const body=document.getElementById('media-body');const mobileBody=document.getElementById('mobile-media-body');document.getElementById('score-btn').classList.toggle('primary',mediaMode==='score');document.getElementById('video-btn').classList.toggle('primary',mediaMode==='video');document.getElementById('mobile-score-btn')?.classList.toggle('primary',mediaMode==='score');document.getElementById('mobile-video-btn')?.classList.toggle('primary',mediaMode==='video');if(!s){body.innerHTML='<div class="empty-preview">곡을 선택해주세요.</div>';if(mobileBody)mobileBody.innerHTML='<div class="empty-preview">곡을 선택해주세요.</div>';return}document.getElementById('media-title').textContent=mediaMode==='video'?'영상 미리보기':'악보 미리보기';document.getElementById('media-sub').textContent=s.name||'';const setBodies=html=>{body.innerHTML=html;if(mobileBody)mobileBody.innerHTML=html};if(mediaMode==='video'){const embed=youtubeEmbed(s.music_url);setBodies(embed?`<iframe src="${embed}" title="${esc(s.name)} 영상" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>`:'<div class="empty-preview">등록된 유튜브 링크가 없습니다.</div>');return}setBodies('<div class="empty-preview">악보를 불러오는 중입니다.</div>');const files=await listScores(s.id);const first=files[0];setBodies(first?`<div class="score-scroll"><img src="${scoreUrl(first.storage_path)}" alt="${esc(s.name)} 악보"></div>`:'<div class="empty-preview">등록된 악보 파일이 없습니다.</div>')}
Object.assign(window,{render,openSongDetail,setMediaMode,openEditForm,saveSongEdit,showMemoHistory,useMemoHistory,createSongVersion});
async function init(){try{const [songData,historyData]=await Promise.all([api('songs?select=*&order=name.asc&limit=2000'),api('worship_history?select=id,worship_date,song_ids,song_names,note&order=worship_date.desc&limit=500')]);songs=songData;historyRows=historyData;render()}catch(e){songs=[{name:'기대',key:'A',bpm:105,has_score:true},{name:'가서 제자 삼으라',key:'A',bpm:120,has_score:true}];historyRows=[];render()}}init();
</script></body></html>
