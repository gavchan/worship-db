<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Worship DB 실행 점검</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR',system-ui,sans-serif;background:#0b1020;color:#eef3ff;padding:24px}.wrap{max-width:980px;margin:0 auto}.badge{display:inline-flex;padding:7px 12px;border:1px solid rgba(255,255,255,.14);border-radius:999px;background:rgba(255,255,255,.06);font-size:13px;color:#cbd5e1}h1{margin:18px 0 8px;font-size:34px;letter-spacing:-.04em}.desc{color:#a8b3c7;line-height:1.7;margin:0 0 22px}.panel{border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.055);border-radius:22px;padding:18px;margin:14px 0}.row{display:flex;gap:12px;justify-content:space-between;align-items:center;border-top:1px solid rgba(255,255,255,.08);padding:12px 0}.row:first-child{border-top:0}.name{font-weight:800}.sub{font-size:12px;color:#9aa6bc;margin-top:4px}.status{font-weight:900;border-radius:999px;padding:6px 10px;font-size:12px;white-space:nowrap}.ok{background:rgba(34,197,94,.16);color:#86efac}.warn{background:rgba(250,204,21,.16);color:#fde68a}.bad{background:rgba(248,113,113,.16);color:#fecaca}.btns{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}button,a.btn{border:1px solid rgba(255,255,255,.14);background:white;color:#070a12;border-radius:14px;padding:11px 14px;font-weight:800;text-decoration:none;cursor:pointer}.ghost{background:rgba(255,255,255,.06)!important;color:#eef3ff!important}.small{font-size:12px;color:#94a3b8;line-height:1.65;margin-top:12px}pre{white-space:pre-wrap;background:#070b16;border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:14px;color:#cbd5e1;max-height:260px;overflow:auto}</style>
</head>
<body>
<main class="wrap">
  <div class="badge">🩺 Worship DB 실행 점검</div>
  <h1>배포 전에 길이 끊겼는지 확인합니다</h1>
  <p class="desc">필수 HTML 파일, 관리 도구 연결, 브라우저 저장소 접근 가능 여부를 빠르게 확인합니다. 실제 Supabase 연결은 <b>DB 연결 점검</b>에서 따로 확인하세요.</p>
  <section class="panel">
    <h2>필수 파일</h2>
    <div id="fileChecks"></div>
    <div class="btns"><button onclick="runChecks()">다시 점검</button><a class="btn ghost" href="db-health-check.html">DB 연결 점검 열기</a><a class="btn ghost" href="backup-restore.html">백업 / 복원 열기</a><a class="btn ghost" href="index.html">처음 화면</a></div>
  </section>
  <section class="panel">
    <h2>브라우저 저장소</h2>
    <div id="storageChecks"></div>
    <p class="small">로컬 테스트에서는 파일 접근 정책 때문에 일부 fetch 점검이 실패할 수 있습니다. 배포 서버에서 다시 확인하면 더 정확합니다.</p>
  </section>
  <section class="panel">
    <h2>점검 로그</h2>
    <pre id="log">아직 점검 전입니다.</pre>
  </section>
</main>
<script>
const requiredFiles=[
  ['index.html','시작 분기 화면'],['pc.html','PC 관리 모드'],['mobile.html','모바일 통합 화면'],['mobile-portrait.html','세로 연주 모드'],['mobile-landscape.html','가로 2페이지 연주 모드'],['score-upload.html','악보 일괄등록기'],['score-version-manager.html','악보 버전관리'],['song-editor.html','순차 편집기'],['db-health-check.html','DB 연결 점검'],['backup-restore.html','백업 / 복원'],['phase2b_schema.sql','DB 확장 SQL']
];
function row(title,sub,status,cls){return `<div class="row"><div><div class="name">${title}</div><div class="sub">${sub||''}</div></div><div class="status ${cls}">${status}</div></div>`}
async function checkFile(file){try{const res=await fetch(file,{cache:'no-store'});return res.ok?['확인됨','ok']:[`응답 ${res.status}`,'warn']}catch(e){return ['확인 필요','warn']}}
function checkStorage(){const out=[];try{localStorage.setItem('__worship_check__','ok');const v=localStorage.getItem('__worship_check__');localStorage.removeItem('__worship_check__');out.push(row('localStorage','콘티/설정 임시 저장 접근',v==='ok'?'정상':'확인 필요',v==='ok'?'ok':'warn'))}catch(e){out.push(row('localStorage','브라우저 저장소 접근 실패','실패','bad'))}
try{sessionStorage.setItem('__worship_check__','ok');const v=sessionStorage.getItem('__worship_check__');sessionStorage.removeItem('__worship_check__');out.push(row('sessionStorage','연주 위치/임시 상태 저장 접근',v==='ok'?'정상':'확인 필요',v==='ok'?'ok':'warn'))}catch(e){out.push(row('sessionStorage','세션 저장소 접근 실패','실패','bad'))}
document.getElementById('storageChecks').innerHTML=out.join('')}
async function runChecks(){const log=[];document.getElementById('fileChecks').innerHTML=row('점검 중','필수 파일을 확인하고 있습니다','진행','warn');const rows=[];for(const [file,desc] of requiredFiles){const [status,cls]=await checkFile(file);rows.push(row(file,desc,status,cls));log.push(`${file}: ${status}`)}document.getElementById('fileChecks').innerHTML=rows.join('');checkStorage();document.getElementById('log').textContent=log.join('\n')+'\n\n완료: '+new Date().toLocaleString('ko-KR')}
runChecks();
</script>

<style>
/* === Phase12 codefix: existing score thumbnail preview in sequential editor === */
.phase12-existing-score-preview {
  margin-top: 10px;
  padding: 12px;
  border-radius: 14px;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.12);
}

.phase12-existing-score-title {
  font-size: 13px;
  font-weight: 800;
  margin-bottom: 8px;
}

.phase12-existing-score-list {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding-bottom: 4px;
}

.phase12-existing-score-item {
  min-width: 120px;
  max-width: 150px;
  border-radius: 12px;
  overflow: hidden;
  background: rgba(0,0,0,0.18);
  border: 1px solid rgba(255,255,255,0.10);
  cursor: pointer;
}

.phase12-existing-score-thumb {
  width: 100%;
  aspect-ratio: 3 / 4;
  object-fit: cover;
  display: block;
  background: rgba(0,0,0,0.35);
}

.phase12-existing-score-info {
  padding: 8px;
}

.phase12-existing-score-name {
  font-size: 12px;
  line-height: 1.35;
  word-break: break-all;
}

.phase12-existing-score-meta {
  margin-top: 4px;
  font-size: 11px;
  opacity: 0.72;
}

.phase12-score-modal {
  position: fixed;
  inset: 0;
  z-index: 99999;
  background: rgba(0,0,0,0.82);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

.phase12-score-modal.open { display: flex; }

.phase12-score-modal img {
  max-width: min(96vw, 980px);
  max-height: 90vh;
  object-fit: contain;
  border-radius: 14px;
  background: #111;
}

.phase12-score-modal-close {
  position: fixed;
  right: 18px;
  top: 18px;
  border: 0;
  border-radius: 999px;
  padding: 10px 14px;
  font-size: 18px;
  font-weight: 900;
  background: rgba(255,255,255,0.92);
  color: #111;
  cursor: pointer;
}
</style>

<script>
/* === Phase12 codefix: render existing score previews wherever "악보 있음" appears === */
(function () {
  if (window.__phase12ExistingScorePreviewInstalled) return;
  window.__phase12ExistingScorePreviewInstalled = true;

  function norm(v) {
    return String(v || "").replace(/\s+/g, "").trim().toLowerCase();
  }

  function scoreUrl(item) {
    return item?.url || item?.image_url || item?.file_url || item?.score_url || item?.publicUrl || item?.public_url || item?.src || item?.path || "";
  }

  function scoreName(item, i) {
    return item?.filename || item?.file_name || item?.name || item?.title || item?.score_name || ("악보 " + (i + 1));
  }

  function collectScores() {
    const arr = [];
    [
      window.scores,
      window.scoreFiles,
      window.songScores,
      window.scoreImages,
      window.allScores,
      window.scoreList,
      window.uploadedScores,
      window.existingScores
    ].forEach(v => Array.isArray(v) && v.forEach(x => arr.push(x)));

    ["state", "appState", "WorshipDB", "worshipDB", "db"].forEach(k => {
      const obj = window[k];
      if (!obj || typeof obj !== "object") return;
      ["scores", "scoreFiles", "songScores", "scoreImages", "allScores"].forEach(key => {
        if (Array.isArray(obj[key])) obj[key].forEach(x => arr.push(x));
      });
    });

    const seen = new Set();
    return arr.filter(item => {
      const sig = scoreUrl(item) + "|" + scoreName(item, 0);
      if (!scoreUrl(item) || seen.has(sig)) return false;
      seen.add(sig);
      return true;
    });
  }

  function guessSongName(el) {
    const host = el.closest(".song-card, .song-item, .edit-card, .sequential-item, .seq-item, .card, li, tr, section, article, div") || el.parentElement;
    if (!host) return "";

    const input = host.querySelector('input[name*="title"], input[name*="song"], input[placeholder*="곡"], input[placeholder*="제목"], textarea[name*="title"]');
    if (input && input.value) return input.value.trim();

    const title = host.querySelector(".song-title, .title, .name, h1, h2, h3, h4, strong");
    if (title && title.textContent) return title.textContent.replace(/악보\s*있음/g, "").trim();

    const lines = (host.textContent || "").split(/\n|·|\|/).map(x => x.trim()).filter(Boolean);
    return (lines.find(x => !/악보\s*있음|저장|수정|삭제|업로드/.test(x)) || "").trim();
  }

  function matchingScores(songName) {
    const target = norm(songName);
    if (!target) return [];
    return collectScores().filter(item => {
      const hay = norm([
        item?.song_title, item?.song_name, item?.songTitle, item?.song,
        item?.filename, item?.file_name, item?.name, item?.title
      ].join(" "));
      return hay && (hay.includes(target) || target.includes(hay));
    }).slice(0, 12);
  }

  function modal() {
    let m = document.querySelector(".phase12-score-modal");
    if (m) return m;
    m = document.createElement("div");
    m.className = "phase12-score-modal";
    m.innerHTML = '<button class="phase12-score-modal-close" type="button">×</button><img alt="악보 확대 미리보기">';
    document.body.appendChild(m);
    m.addEventListener("click", e => {
      if (e.target === m || e.target.classList.contains("phase12-score-modal-close")) m.classList.remove("open");
    });
    return m;
  }

  function openPreview(url) {
    const m = modal();
    m.querySelector("img").src = url;
    m.classList.add("open");
  }

  function render(el) {
    if (!el || el.dataset.phase12PreviewDone === "1") return;
    const found = matchingScores(guessSongName(el));
    if (!found.length) return;

    el.dataset.phase12PreviewDone = "1";
    const box = document.createElement("div");
    box.className = "phase12-existing-score-preview";
    box.innerHTML = '<div class="phase12-existing-score-title">기존 악보 미리보기</div><div class="phase12-existing-score-list"></div>';
    const list = box.querySelector(".phase12-existing-score-list");

    found.forEach((item, i) => {
      const url = scoreUrl(item);
      if (!url) return;
      const card = document.createElement("div");
      card.className = "phase12-existing-score-item";
      card.innerHTML =
        '<img class="phase12-existing-score-thumb" loading="lazy" alt="">' +
        '<div class="phase12-existing-score-info">' +
        '<div class="phase12-existing-score-name"></div>' +
        '<div class="phase12-existing-score-meta"></div>' +
        '</div>';
      card.querySelector("img").src = url;
      card.querySelector("img").alt = scoreName(item, i);
      card.querySelector(".phase12-existing-score-name").textContent = scoreName(item, i);
      const page = item?.page || item?.page_no || item?.pageNumber || item?.page_number || (i + 1);
      card.querySelector(".phase12-existing-score-meta").textContent = page ? ("페이지 " + page) : "기존 악보";
      card.addEventListener("click", () => openPreview(url));
      list.appendChild(card);
    });

    if (!list.children.length) return;
    el.parentElement.insertBefore(box, el.nextSibling);
  }

  function scan() {
    Array.from(document.querySelectorAll("body *")).forEach(el => {
      const text = (el.textContent || "").trim();
      if (text && text.length <= 40 && /악보\s*있음/.test(text)) render(el);
    });
  }

  document.addEventListener("DOMContentLoaded", () => setTimeout(scan, 300));
  window.addEventListener("load", () => setTimeout(scan, 800));

  const observer = new MutationObserver(() => {
    clearTimeout(window.__phase12ScoreScanTimer);
    window.__phase12ScoreScanTimer = setTimeout(scan, 300);
  });
  observer.observe(document.documentElement, { childList: true, subtree: true });
})();
</script>

</body>
</html>
