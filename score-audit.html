<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>악보 연결 점검 유틸</title>
<style>
:root{--bg:#0b1020;--card:#12192d;--card2:#18223b;--line:rgba(255,255,255,.13);--muted:#9aa3b8;--text:#f7f8fb;--accent:#7dd3fc;--green:#86efac;--danger:#ff8b8b;--amber:#fbbf24}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif}.wrap{max-width:1220px;margin:0 auto;padding:20px}.top{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin-bottom:14px}.badge{display:inline-flex;border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:999px;padding:6px 10px;font-size:12px;color:#dce4ff}h1{font-size:28px;margin:10px 0 5px}p{color:var(--muted);font-size:13px;line-height:1.55}.panel{border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:22px;padding:14px;margin-bottom:12px}.controls{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:center}input,select{width:100%;border:1px solid var(--line);background:rgba(255,255,255,.06);color:white;border-radius:12px;padding:10px 12px;font-size:13px;outline:none}option{color:#111}button{border:1px solid var(--line);background:rgba(255,255,255,.06);color:white;border-radius:12px;padding:10px 12px;font-size:13px;cursor:pointer}button.primary{background:white;color:#07101f;border-color:white;font-weight:900}button.danger{background:rgba(255,70,70,.12);border-color:rgba(255,70,70,.35);color:#ffd1d1}button.good{background:rgba(70,255,140,.12);border-color:rgba(70,255,140,.35);color:#dcffe8}button:disabled{opacity:.45;cursor:not-allowed}.summary{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.stat{border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:16px;padding:11px}.stat b{display:block;font-size:23px}.stat span{font-size:11px;color:var(--muted)}.log{white-space:pre-wrap;font-size:12px;color:#dbe4ff;background:#0a0f1e;border:1px solid var(--line);border-radius:14px;padding:10px;max-height:160px;overflow:auto}.song-list{display:grid;gap:12px}.song-card{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:14px}.song-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.song-title{font-size:18px;font-weight:900}.meta{font-size:12px;color:var(--muted);margin-top:4px}.pill{display:inline-flex;border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:999px;padding:4px 7px;font-size:11px;color:#dbe3f6;margin:5px 4px 0 0}.pill.warn{color:#fff1bd;border-color:rgba(251,191,36,.35);background:rgba(251,191,36,.08)}.pill.bad{color:#ffd1d1;border-color:rgba(255,80,80,.35);background:rgba(255,80,80,.08)}.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:12px}.file{border:1px solid rgba(255,255,255,.1);background:var(--card2);border-radius:16px;overflow:hidden}.thumb{width:100%;aspect-ratio:3/4;background:#0a0f1e;display:flex;align-items:center;justify-content:center;color:#7e879a;font-size:12px}.thumb img{width:100%;height:100%;object-fit:cover;display:block}.file-body{padding:9px}.file-name{font-size:12px;line-height:1.35;word-break:break-all}.file-path{font-size:10.5px;color:var(--muted);line-height:1.3;word-break:break-all;margin-top:5px}.file-actions{display:flex;gap:6px;margin-top:8px}.file-actions button{flex:1;padding:7px 8px;font-size:12px}.empty{border:1px dashed rgba(255,255,255,.24);border-radius:18px;padding:20px;text-align:center;color:#cbd5e1;background:rgba(255,255,255,.035)}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:9999;align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}.modal img{max-width:96vw;max-height:88vh;object-fit:contain;background:#111;border-radius:12px}.modal button{position:fixed;right:18px;top:18px;background:white;color:#111;border-color:white;border-radius:999px;font-weight:900}@media(max-width:760px){.wrap{padding:14px}.top{display:block}.controls{grid-template-columns:1fr}.summary{grid-template-columns:repeat(2,1fr)}.song-head{display:block}.files{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><span class="badge">🧹 악보 연결 안전 점검</span><h1>악보 중복/다중 연결 점검</h1><p>한 곡에 여러 악보 파일이 연결된 경우만 찾아 보여줍니다. 자동 삭제는 하지 않고, 미리보기 후 선택 삭제와 상태 재정리만 합니다.</p></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button onclick="location.href='pc.html'">PC</button><button onclick="location.href='mobile.html'">모바일</button></div>
  </div>

  <div class="panel">
    <div class="controls">
      <input id="q" placeholder="곡명 검색" oninput="renderResults()">
      <select id="mode" onchange="renderResults()">
        <option value="multi">여러 악보만</option>
        <option value="allWithScore">악보 있는 곡 전체</option>
        <option value="mismatch">상태 불일치만</option>
      </select>
      <button class="primary" id="scanBtn" onclick="scan()">점검 시작</button>
      <button onclick="renderResults()">새로고침</button>
    </div>
  </div>

  <div class="panel summary" id="summary" style="display:none">
    <div class="stat"><b id="stSongs">0</b><span>전체 곡</span></div>
    <div class="stat"><b id="stHas">0</b><span>악보 있음</span></div>
    <div class="stat"><b id="stMulti">0</b><span>여러 악보 의심</span></div>
    <div class="stat"><b id="stMismatch">0</b><span>상태 불일치</span></div>
    <div class="stat"><b id="stFiles">0</b><span>확인 파일</span></div>
  </div>

  <div class="panel log" id="log">점검 시작을 누르면 현재 DB와 Storage를 비교합니다.</div>
  <div class="song-list" id="results"></div>
</div>
<div class="modal" id="preview" onclick="closePreview()"><button>✕</button><img id="previewImg" alt="악보 미리보기"></div>
<script>
const SB_URL='https://rmtysrytveexshwzenxj.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJIUzI1NiIsInJlZiI6InJtdHlzcnl0dmVleHNod3plbnhqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY1MjQ3OTYsImV4cCI6MjA5MjEwMDc5Nn0.5FzzJ1rg-uRG4jAGZ75xVT3i3NH0m6J_tDeOS4GxyT8'.replace('eyJpc3MiOiJIUzI1NiIsInJlZiI','eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI');
const RH={'apikey':KEY,'Authorization':'Bearer '+KEY};
const JH={'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+KEY,'Prefer':'return=minimal'};
const STORAGE=SB_URL+'/storage/v1';
let audit=[];
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function norm(s){return String(s||'').normalize('NFC').replace(/[\s_\-\[\](){}]+/g,'').trim().toLowerCase()}
function log(t){const el=document.getElementById('log');el.textContent += '\n'+t;el.scrollTop=el.scrollHeight}
async function rest(path,opt={}){const r=await fetch(SB_URL+'/rest/v1/'+path,{headers:RH,...opt});if(!r.ok)throw new Error(await r.text());const t=await r.text();return t?JSON.parse(t):[]}
async function patchSong(id,body){await fetch(`${SB_URL}/rest/v1/songs?id=eq.${id}`,{method:'PATCH',headers:JH,body:JSON.stringify({...body,updated_at:new Date().toISOString()})})}
async function deleteScoreRecordByPath(path){await fetch(`${SB_URL}/rest/v1/song_score_files?storage_path=eq.${encodeURIComponent(path)}`,{method:'DELETE',headers:JH}).catch(()=>{})}
async function listStorage(prefix){const r=await fetch(`${STORAGE}/object/list/scores`,{method:'POST',headers:{...RH,'Content-Type':'application/json'},body:JSON.stringify({prefix,limit:1000,sortBy:{column:'name',order:'asc'}})});if(!r.ok)return [];return await r.json()}
function isImageName(name){return /\.(png|jpe?g|webp|gif)$/i.test(name||'')}
async function listStorageRecursive(prefix,depth=0){if(depth>5)return [];const rows=await listStorage(prefix);let out=[];for(const item of rows){if(!item||!item.name)continue;const full=prefix+item.name;const looksFolder=!item.id && !item.metadata && !/\.[a-z0-9]{2,5}$/i.test(item.name);if(looksFolder){out=out.concat(await listStorageRecursive(full.replace(/\/+$/,'')+'/',depth+1));}else if(isImageName(item.name)){out.push({source:'storage',storage_path:full,file_name:item.name,db_id:null});}}
return out}
function publicUrl(path){return `${STORAGE}/object/public/scores/${encodeURIComponent(path).replaceAll('%2F','/')}`}
function groupKey(path){const parts=String(path||'').split('/').filter(Boolean);if(parts.includes('versions')){const i=parts.indexOf('versions');return parts[i+1]?'version:'+parts[i+1]:'version';}return parts.slice(0,-1).join('/')||'root'}
async function scan(){const btn=document.getElementById('scanBtn');btn.disabled=true;document.getElementById('log').textContent='📋 전체 곡 불러오는 중...';document.getElementById('results').innerHTML='';audit=[];try{const songs=await rest('songs?select=id,name,key,bpm,bpm_min,bpm_max,status,has_score,count&order=name&limit=3000');let scoreRows=[];try{scoreRows=await rest('song_score_files?select=id,song_id,storage_path,file_name,page_no,version_id&limit=8000')}catch(e){log('ℹ️ 확장 악보 파일 테이블이 없거나 비어 있어 Storage 기준으로만 점검합니다.')}const bySong=new Map();for(const r of scoreRows){if(!r.song_id||!r.storage_path)continue;if(!bySong.has(String(r.song_id)))bySong.set(String(r.song_id),[]);bySong.get(String(r.song_id)).push({source:'db',db_id:r.id,storage_path:r.storage_path,file_name:r.file_name||String(r.storage_path).split('/').pop(),page_no:r.page_no,version_id:r.version_id});}
let totalFiles=0,has=0,multi=0,mismatch=0;for(let i=0;i<songs.length;i++){const s=songs[i];let files=[...(bySong.get(String(s.id))||[])];let paths=new Set(files.map(f=>f.storage_path));const storageFiles=await listStorageRecursive(String(s.id).replace(/\/+$/,'')+'/');for(const f of storageFiles){if(!paths.has(f.storage_path)){files.push(f);paths.add(f.storage_path);}}
files=files.filter(f=>isImageName(f.file_name||f.storage_path));files.sort((a,b)=>String(a.storage_path).localeCompare(String(b.storage_path),'ko'));
const groups=[...new Set(files.map(f=>groupKey(f.storage_path)))];const actualHas=files.length>0;const isMismatch=actualHas!==!!s.has_score || (actualHas&&s.status==='plan') || (!actualHas&&s.status==='ready');const isMulti=files.length>1 || groups.length>1;totalFiles+=files.length;if(actualHas)has++;if(isMulti)multi++;if(isMismatch)mismatch++;if(actualHas||isMismatch){audit.push({song:s,files,groups,isMulti,isMismatch,actualHas});}
if((i+1)%20===0)log(`... ${i+1}/${songs.length}곡 점검 중`)}
document.getElementById('summary').style.display='grid';document.getElementById('stSongs').textContent=songs.length;document.getElementById('stHas').textContent=has;document.getElementById('stMulti').textContent=multi;document.getElementById('stMismatch').textContent=mismatch;document.getElementById('stFiles').textContent=totalFiles;log(`✅ 점검 완료: 여러 악보 의심 ${multi}곡, 상태 불일치 ${mismatch}곡`);renderResults();}catch(e){log('✗ 오류: '+e.message)}btn.disabled=false}
function renderResults(){const q=norm(document.getElementById('q').value);const mode=document.getElementById('mode').value;let rows=audit.filter(x=>!q||norm(x.song.name).includes(q));if(mode==='multi')rows=rows.filter(x=>x.isMulti);if(mode==='allWithScore')rows=rows.filter(x=>x.actualHas);if(mode==='mismatch')rows=rows.filter(x=>x.isMismatch);const box=document.getElementById('results');if(!rows.length){box.innerHTML='<div class="empty">표시할 곡이 없습니다. 점검 전이라면 먼저 “점검 시작”을 눌러주세요.</div>';return}box.innerHTML=rows.map(x=>cardHtml(x)).join('')}
function cardHtml(x){const s=x.song;const bpm=s.bpm_min||s.bpm_max?`${s.bpm_min||''}${s.bpm_max&&s.bpm_max!==s.bpm_min?'~'+s.bpm_max:''}`:(s.bpm||'-');return `<div class="song-card"><div class="song-head"><div><div class="song-title">${esc(s.name)}</div><div class="meta">ID ${esc(s.id)} · Key ${esc(s.key||'-')} · BPM ${esc(bpm)} · 상태 ${esc(s.status||'-')}</div><span class="pill ${x.isMulti?'warn':''}">악보 ${x.files.length}개</span><span class="pill">그룹 ${x.groups.length}개</span>${x.isMismatch?'<span class="pill bad">상태 불일치</span>':''}</div><div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end"><button class="good" onclick="syncOne('${esc(String(s.id))}')">상태 재정리</button></div></div><div class="files">${x.files.map(f=>fileHtml(s.id,f)).join('')}</div></div>`}
function fileHtml(songId,f){const path=f.storage_path||'';const url=publicUrl(path);return `<div class="file"><div class="thumb">${isImageName(path)?`<img src="${url}" loading="lazy" onerror="this.parentElement.textContent='미리보기 실패'">`:'파일'}</div><div class="file-body"><div class="file-name">${esc(f.file_name||path.split('/').pop())}</div><div class="file-path">${esc(path)}</div><div class="file-actions"><button onclick="openPreview('${encodeURIComponent(url)}')">보기</button><button class="danger" onclick="deleteFile('${esc(String(songId))}','${encodeURIComponent(path)}')">삭제</button></div></div></div>`}
function openPreview(u){document.getElementById('previewImg').src=decodeURIComponent(u);document.getElementById('preview').classList.add('show')}
function closePreview(){document.getElementById('preview').classList.remove('show');document.getElementById('previewImg').src=''}
async function syncOne(songId){const row=audit.find(x=>String(x.song.id)===String(songId));if(!row)return;const actual=row.files.length>0;let body={has_score:actual};if(actual&&row.song.status==='plan')body.status='ready';if(!actual&&row.song.status==='ready')body.status='plan';await patchSong(songId,body);row.song.has_score=actual;if(body.status)row.song.status=body.status;row.isMismatch=false;log(`✓ ${row.song.name} 상태 재정리 완료`);renderResults()}
async function deleteFile(songId,encodedPath){const path=decodeURIComponent(encodedPath);const row=audit.find(x=>String(x.song.id)===String(songId));const songName=row?.song?.name||'';if(!confirm(`이 악보 파일을 삭제할까요?\n\n곡: ${songName}\n파일: ${path}\n\nStorage 실제 파일과 DB 파일 기록을 함께 정리합니다.`))return;try{await fetch(`${STORAGE}/object/scores`,{method:'DELETE',headers:{...RH,'Content-Type':'application/json'},body:JSON.stringify({prefixes:[path]})});await deleteScoreRecordByPath(path);if(row){row.files=row.files.filter(f=>f.storage_path!==path);row.groups=[...new Set(row.files.map(f=>groupKey(f.storage_path)))];row.actualHas=row.files.length>0;row.isMulti=row.files.length>1||row.groups.length>1;await syncOne(songId);}log(`🗑 삭제 완료: ${path}`);renderResults();}catch(e){log('✗ 삭제 실패: '+e.message)}}
</script>
</body>
</html>
