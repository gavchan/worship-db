<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>성가대 자료실</title><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="test-site.css"></head>
<body><div class="test-page"><header class="top"><a class="brand" href="index.html">성가대 자료실</a><nav class="nav"><a class="on" href="test-choir.html">성가대 홈</a><a href="choir.html">성가곡</a><button type="button" onclick="shareChoirLibrary()">자료 공유</button><a href="choir-upload.html">성가곡 등록</a><a href="index.html">통합 홈</a></nav></header>
<main class="wrap"><div class="eyebrow">✦ 4성부 악보 · 파트별 영상</div><h1>성가대 자료실</h1><p class="lead">성가대는 찬양단 내부 메뉴에서 분리하고, 통합 메인에서 바로 들어오는 독립 영역으로 둡니다.</p><div class="grid"><a class="tile" href="choir.html"><b>성가대 자료 보기</b><span>4성부 악보와 소프라노·알토·테너·베이스 자료를 확인합니다.</span></a><button class="tile" type="button" onclick="shareChoirLibrary()"><b>성가대 자료 공유</b><span>받는 사람은 자료실 읽기 전용 화면만 봅니다.</span></button><a class="tile" href="choir-upload.html"><b>성가곡 등록</b><span>PDF를 페이지별 이미지로 나누어 R2에 저장합니다.</span></a></div></main></div><script>function choirShareUrl(){return new URL('choir.html?shared=1',location.href).href}async function shareChoirLibrary(){const url=choirShareUrl();const title='성가대 자료실';const text='4성부 악보와 파트별 연습 자료를 확인하세요.';try{if(navigator.share){await navigator.share({title,text,url});return}}catch(e){}try{await navigator.clipboard.writeText(url);alert('성가대 자료실 공유 링크를 복사했습니다.')}catch(e){prompt('이 링크를 복사해서 공유하세요',url)}}</script></body></html>
