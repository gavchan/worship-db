<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>테스트 찬양콘티</title><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="test-site.css"></head>
<body><div class="test-page"><header class="top"><a class="brand" href="test-main.html">드림찬양단</a><nav class="nav"><a href="test-main.html">홈</a><a class="on" href="test-conti.html">찬양콘티</a><a href="test-songs.html">악보</a><a href="test-choir.html">성가대</a><a href="test-tools.html">관리도구</a></nav></header>
<main class="wrap"><div class="eyebrow">✦ 이번 주 예배 흐름</div><h1>찬양콘티</h1><p class="lead">최근 등록된 콘티를 같은 테마 안에서 확인하고, 실제 연주 화면이나 공유 화면으로 바로 이동합니다.</p>
<div class="grid"><section class="card"><div class="card-head"><h2>최근 콘티</h2><span class="muted" id="date">불러오는 중</span></div><div class="rows" id="list"><div class="row"><div class="num">1</div><div><div class="title">콘티를 불러오고 있습니다</div><div class="sub">잠시만 기다려주세요</div></div><span class="pill">준비중</span></div></div></section>
<section class="card"><div class="card-head"><h2>바로가기</h2><span class="muted">실제 기능</span></div><div style="padding:20px"><div class="btn-row"><a class="btn primary" href="mobile.html">연주 화면 열기</a><a class="btn" id="share" href="share.html">공유 화면 열기</a><a class="btn" href="pc.html">PC 관리 화면</a></div></div></section></div></main></div>
<script>
const SUPABASE_URL='https://rmtysrytveexshwzenxj.supabase.co';const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJtdHlzcnl0dmVleHNod3plbnhqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY1MjQ3OTYsImV4cCI6MjA5MjEwMDc5Nn0.5FzzJ1rg-uRG4jAGZ75xVT3i3NH0m6J_tDeOS4GxyT8';
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function fallback(){const names=['기대','가서 제자 삼으라','많은 사람들','내 마음에 주를 향한 사랑이'];document.getElementById('date').textContent='테스트 콘티';document.getElementById('list').innerHTML=names.map((n,i)=>`<div class="row"><div class="num">${i+1}</div><div><div class="title">${esc(n)}</div><div class="sub">찬양콘티</div></div><span class="pill">악보</span></div>`).join('')}
async function init(){try{const res=await fetch(`${SUPABASE_URL}/rest/v1/worship_history?select=id,worship_date,song_names&order=worship_date.desc&limit=1`,{headers:{apikey:KEY,Authorization:`Bearer ${KEY}`}});if(!res.ok)throw 0;const h=(await res.json())[0];const names=(h?.song_names||[]).filter(Boolean);if(!names.length)return fallback();document.getElementById('date').textContent=h.worship_date;document.getElementById('share').href=`share.html?id=${encodeURIComponent(h.id)}`;document.getElementById('list').innerHTML=names.map((n,i)=>`<div class="row"><div class="num">${i+1}</div><div><div class="title">${esc(n)}</div><div class="sub">주일 찬양</div></div><span class="pill">준비</span></div>`).join('')}catch(e){fallback()}}init();
</script></body></html>
