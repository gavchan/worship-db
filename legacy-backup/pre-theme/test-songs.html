<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>테스트 악보</title><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="test-site.css"></head>
<body><div class="test-page"><header class="top"><a class="brand" href="test-main.html">드림찬양단</a><nav class="nav"><a href="test-main.html">홈</a><a href="test-conti.html">찬양콘티</a><a class="on" href="test-songs.html">악보</a><a href="test-choir.html">성가대</a><a href="test-tools.html">관리도구</a></nav></header>
<main class="wrap"><div class="eyebrow">✦ 곡 검색 · 악보 · 영상</div><h1>악보 자료</h1><p class="lead">메인 테마 안에서 곡을 빠르게 검색하는 테스트 화면입니다. 실제 수정과 업로드는 PC 관리 화면에서 진행합니다.</p><div class="search"><input id="q" placeholder="곡 제목 검색" oninput="render()"></div><div class="grid three" id="cards"></div><div class="btn-row"><a class="btn primary" href="pc.html">PC 곡 데이터베이스 열기</a><a class="btn" href="mobile.html">연주 화면 열기</a></div></main></div>
<script>
const SUPABASE_URL='https://rmtysrytveexshwzenxj.supabase.co';const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJtdHlzcnl0dmVleHNod3plbnhqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY1MjQ3OTYsImV4cCI6MjA5MjEwMDc5Nn0.5FzzJ1rg-uRG4jAGZ75xVT3i3NH0m6J_tDeOS4GxyT8';let songs=[];
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const norm=v=>String(v||'').replace(/\s+/g,'').toLowerCase();
function render(){const q=norm(document.getElementById('q').value);const list=songs.filter(s=>!q||norm(s.name).includes(q)).slice(0,12);document.getElementById('cards').innerHTML=list.map(s=>`<a class="tile" href="pc.html"><b>${esc(s.name)}</b><span>Key ${esc(s.key||s.score_key||'미정')} · BPM ${esc(s.bpm||s.bpm_min||'미정')}<br>${s.has_score?'악보 연결됨':'악보 준비중'} · ${s.music_url?'영상 있음':'영상 없음'}</span></a>`).join('')||'<div class="card" style="padding:22px">검색 결과가 없습니다.</div>'}
async function init(){try{const res=await fetch(`${SUPABASE_URL}/rest/v1/songs?select=*&order=name.asc&limit=120`,{headers:{apikey:KEY,Authorization:`Bearer ${KEY}`}});songs=await res.json();render()}catch(e){songs=[{name:'기대',key:'A',bpm:105,has_score:true},{name:'가서 제자 삼으라',key:'A',bpm:120,has_score:true}];render()}}init();
</script></body></html>
