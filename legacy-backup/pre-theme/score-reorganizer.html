<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="admin-guard.js"></script>
<title>악보 재배치 / DB 정리 유틸</title>
<style>
:root{--bg:#0b1020;--card:#12192d;--card2:#18223b;--line:rgba(255,255,255,.13);--muted:#9aa3b8;--text:#f7f8fb;--accent:#7dd3fc;--green:#86efac;--danger:#ff8b8b;--amber:#fbbf24}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#17203a,#080c18 60%);color:var(--text);font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif}.wrap{max-width:1280px;margin:0 auto;padding:20px}.top{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin-bottom:14px}.badge{display:inline-flex;border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:999px;padding:6px 10px;font-size:12px;color:#dce4ff}h1{font-size:28px;margin:10px 0 5px}p{color:var(--muted);font-size:13px;line-height:1.55}.panel{border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:22px;padding:14px;margin-bottom:12px}.controls{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:center}input,select,textarea{width:100%;border:1px solid var(--line);background:rgba(255,255,255,.06);color:white;border-radius:12px;padding:10px 12px;font-size:13px;outline:none}textarea{min-height:72px;resize:vertical}option{color:#111}button{border:1px solid var(--line);background:rgba(255,255,255,.06);color:white;border-radius:12px;padding:10px 12px;font-size:13px;cursor:pointer}button.primary{background:white;color:#07101f;border-color:white;font-weight:900}button.danger{background:rgba(255,70,70,.12);border-color:rgba(255,70,70,.35);color:#ffd1d1}button.good{background:rgba(70,255,140,.12);border-color:rgba(70,255,140,.35);color:#dcffe8}button.warn{background:rgba(251,191,36,.12);border-color:rgba(251,191,36,.35);color:#fff1bd}button:disabled{opacity:.45;cursor:not-allowed}.grid{display:grid;grid-template-columns:360px 1fr;gap:12px}.song-list{display:grid;gap:8px;max-height:72vh;overflow:auto;padding-right:4px}.song-row{border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:16px;padding:11px;cursor:pointer}.song-row.active{border-color:rgba(125,211,252,.7);background:rgba(125,211,252,.1)}.song-row.done{opacity:.58}.song-title{font-size:15px;font-weight:900}.meta{font-size:11px;color:var(--muted);margin-top:4px}.pill{display:inline-flex;border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:999px;padding:4px 7px;font-size:11px;color:#dbe3f6;margin:5px 4px 0 0}.pill.warn{color:#fff1bd;border-color:rgba(251,191,36,.35);background:rgba(251,191,36,.08)}.pill.bad{color:#ffd1d1;border-color:rgba(255,80,80,.35);background:rgba(255,80,80,.08)}.detail{min-height:480px}.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-top:12px}.file{border:1px solid rgba(255,255,255,.1);background:var(--card2);border-radius:16px;overflow:hidden}.thumb{width:100%;aspect-ratio:3/4;background:#0a0f1e;display:flex;align-items:center;justify-content:center;color:#7e879a;font-size:12px}.thumb img{width:100%;height:100%;object-fit:cover;display:block}.file-body{padding:9px}.file-name{font-size:12px;line-height:1.35;word-break:break-all}.file-path{font-size:10.5px;color:var(--muted);line-height:1.3;word-break:break-all;margin-top:5px}.file-actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}.file-actions button{padding:7px 8px;font-size:12px}.form-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.box-title{font-weight:900;margin-bottom:8px}.empty{border:1px dashed rgba(255,255,255,.24);border-radius:18px;padding:20px;text-align:center;color:#cbd5e1;background:rgba(255,255,255,.035)}.log{white-space:pre-wrap;font-size:12px;color:#dbe4ff;background:#0a0f1e;border:1px solid var(--line);border-radius:14px;padding:10px;max-height:160px;overflow:auto}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:9999;align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}.modal img{max-width:96vw;max-height:88vh;object-fit:contain;background:#111;border-radius:12px}.modal button{position:fixed;right:18px;top:18px;background:white;color:#111;border-color:white;border-radius:999px;font-weight:900}.danger-zone{border-color:rgba(255,80,80,.28);background:rgba(255,80,80,.06)}@media(max-width:900px){.wrap{padding:14px}.top{display:block}.controls{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.song-list{max-height:300px}.form-grid{grid-template-columns:1fr}.files{grid-template-columns:repeat(2,minmax(0,1fr))}}



</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><span class="badge">🧬 악보 재배치 / DB 정리</span><h1>악보 재배치</h1><p>악보가 잘못된 곡에 들어갔거나 Key/버전이 뒤섞였을 때 사용합니다. 실제 파일은 안전한 숫자/영문 경로로 옮기고 의미 정보는 DB에 남깁니다.</p></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button onclick="location.href='pc.html'">PC</button><button onclick="location.href='mobile.html'">모바일</button></div>
  </div>

  <div class="panel">
    <div class="controls">
      <input id="q" placeholder="곡명 검색" oninput="renderSongList()">
      <select id="mode" onchange="renderSongList()">
        <option value="withScore">악보 있는 곡</option>
        <option value="multi">여러 악보/여러 버전 의심</option>
        <option value="all">전체 곡</option>
      </select>
      <button class="primary" id="scanBtn" onclick="scan()">불러오기</button>
      <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:#cbd5e1;white-space:nowrap"><input id="showDone" type="checkbox" onchange="renderSongList()" style="width:auto"> 완료곡 보기</label>
      <button onclick="renderSelected()">현재 곡 새로고침</button>
    </div>
  </div>

  <div class="grid">
    <div class="panel"><div class="box-title">곡 목록</div><div class="song-list" id="songList"><div class="empty">불러오기를 눌러주세요.</div></div></div>
    <div class="panel detail" id="detail"><div class="empty">왼쪽에서 곡을 선택하면 악보 재배치/삭제/DB 정리 도구가 열립니다.</div></div>
  </div>
  <div class="panel log" id="log">준비됨</div>
</div>
<div class="modal" id="preview" onclick="closePreview()"><button>✕</button><img id="previewImg" alt="악보 미리보기"></div>
<script>
const SB_URL='https://rmtysrytveexshwzenxj.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJtdHlzcnl0dmVleHNod3plbnhqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY1MjQ3OTYsImV4cCI6MjA5MjEwMDc5Nn0.5FzzJ1rg-uRG4jAGZ75xVT3i3NH0m6J_tDeOS4GxyT8';
const RH={'apikey':KEY,'Authorization':'Bearer '+KEY};
const JH={'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+KEY,'Prefer':'return=minimal'};
const STORAGE=SB_URL+'/storage/v1';
let songs=[], selectedId=null, selectedFiles=[], selectedManifest=null;
const DONE_KEY='worship_score_reorganizer_done_song_ids_v1';
function doneSet(){try{return new Set(JSON.parse(localStorage.getItem(DONE_KEY)||'[]').map(String))}catch(e){return new Set()}}
function isDoneSong(id){return doneSet().has(String(id))}
function saveDoneSet(set){localStorage.setItem(DONE_KEY,JSON.stringify([...set].map(String)))}
function markSongDone(id){const set=doneSet();set.add(String(id));saveDoneSet(set)}
function unmarkSongDone(id){const set=doneSet();set.delete(String(id));saveDoneSet(set)}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function norm(s){return String(s||'').normalize('NFC').replace(/[\s_\-\[\](){}]+/g,'').trim().toLowerCase()}
function log(t){const el=document.getElementById('log');el.textContent += '\n'+t;el.scrollTop=el.scrollHeight}
function isImageName(name){return /\.(png|jpe?g|webp|gif)$/i.test(name||'')}
function extOf(path){const m=String(path||'').match(/\.([a-z0-9]+)$/i);return m?m[1].toLowerCase():'png'}
function versionId(){return 'v'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function safeFileName(page,ext){return `${Date.now()}_${Number(page||1)-1}.${ext||'png'}`}
function publicUrl(path){return `${STORAGE}/object/public/scores/${encodeURIComponent(path).replaceAll('%2F','/')}`}
function manifestPath(songId){return `${songId}/score_manifest.json`}
async function rest(path,opt={}){const r=await fetch(SB_URL+'/rest/v1/'+path,{headers:RH,...opt});if(!r.ok)throw new Error(await r.text());const t=await r.text();return t?JSON.parse(t):[]}
async function patchSong(id,body){await fetch(`${SB_URL}/rest/v1/songs?id=eq.${id}`,{method:'PATCH',headers:JH,body:JSON.stringify({...body,updated_at:new Date().toISOString()})})}
async function listStorage(prefix){const r=await fetch(`${STORAGE}/object/list/scores`,{method:'POST',headers:{...RH,'Content-Type':'application/json'},body:JSON.stringify({prefix,limit:1000,sortBy:{column:'name',order:'asc'}})});if(!r.ok)return [];return await r.json()}
async function listStorageRecursive(prefix,depth=0){if(depth>5)return [];const rows=await listStorage(prefix);let out=[];for(const item of rows){if(!item||!item.name)continue;const full=prefix+item.name;const looksFolder=!item.id && !item.metadata && !/\.[a-z0-9]{2,5}$/i.test(item.name);if(looksFolder){out=out.concat(await listStorageRecursive(full.replace(/\/+$/,'')+'/',depth+1));}else if(isImageName(item.name)){out.push({storage_path:full,file_name:item.name});}}return out}
async function fetchBlob(path){const r=await fetch(publicUrl(path));if(!r.ok)throw new Error('파일 다운로드 실패: '+path);return await r.blob()}
async function uploadBlob(path,blob){const r=await fetch(`${STORAGE}/object/scores/${encodeURIComponent(path).replaceAll('%2F','/')}`,{method:'POST',headers:{...RH,'Content-Type':blob.type||'application/octet-stream','x-upsert':'true'},body:blob});if(!r.ok)throw new Error(await r.text())}
async function deleteStorage(path){await fetch(`${STORAGE}/object/scores`,{method:'DELETE',headers:{...RH,'Content-Type':'application/json'},body:JSON.stringify({prefixes:[path]})})}
async function deleteScoreRecord(path){try{await fetch(`${SB_URL}/rest/v1/song_score_files?storage_path=eq.${encodeURIComponent(path)}`,{method:'DELETE',headers:JH})}catch(e){}}
async function dbJson(path,opt={}){const r=await fetch(SB_URL+'/rest/v1/'+path,{headers:{...RH,'Accept':'application/json'},...opt});if(!r.ok)throw new Error(await r.text());const t=await r.text();return t?JSON.parse(t):[]}
async function getVersions(songId){try{return await dbJson(`song_score_versions?select=*&song_id=eq.${encodeURIComponent(songId)}&order=is_default.desc,created_at.asc`)}catch(e){log('ℹ️ 악보 버전 테이블을 읽지 못했습니다. phase2b_schema.sql 실행이 필요할 수 있습니다.');return []}}
async function getScoreRecords(songId){try{return await dbJson(`song_score_files?select=*&song_id=eq.${encodeURIComponent(songId)}&order=page_no.asc`)}catch(e){return []}}
async function createDbVersion(songId,name,key){const body={song_id:songId,version_name:name||'기본',score_key:key||'',score_type:'코드',is_default:false};const r=await fetch(`${SB_URL}/rest/v1/song_score_versions`,{method:'POST',headers:{...RH,'Content-Type':'application/json','Prefer':'return=representation'},body:JSON.stringify(body)});if(!r.ok)throw new Error(await r.text());const rows=await r.json();return rows[0]}
async function getOrCreateVersion(songId,name,key){name=(name||'기본').trim();key=(key||'').trim();let versions=await getVersions(songId);let v=versions.find(x=>String(x.version_name||'')===name && String(x.score_key||'')===key);if(v)return v;return await createDbVersion(songId,name,key)}
async function insertScoreRecord(songId,versionId,path,pageNo,mimeType){await deleteScoreRecord(path);const body={version_id:versionId,song_id:songId,storage_path:path,file_name:path.split('/').pop(),page_no:Number(pageNo||1),mime_type:mimeType||null,created_at:new Date().toISOString()};const r=await fetch(`${SB_URL}/rest/v1/song_score_files`,{method:'POST',headers:JH,body:JSON.stringify(body)});if(!r.ok){throw new Error(await r.text())}}
async function upsertScoreRecord(songId,path,pageNo,versionName,versionKey,oldPath){
  try{
    const v=await getOrCreateVersion(songId,versionName||'기본',versionKey||'');
    if(oldPath&&oldPath!==path)await deleteScoreRecord(oldPath);
    await insertScoreRecord(songId,v.id,path,pageNo,null);
  }catch(e){log('ℹ️ DB 악보 기록 저장 실패: '+e.message)}
}
async function loadManifest(songId){
  const versions=await getVersions(songId);
  const records=await getScoreRecords(songId);
  const byVer=new Map(versions.map(v=>[String(v.id),v]));
  const files=(selectedFiles||[]).map((f,i)=>{
    const rec=records.find(r=>String(r.storage_path)===String(f.storage_path));
    const ver=rec?byVer.get(String(rec.version_id)):null;
    return {storage_path:f.storage_path,file_name:f.file_name,db_id:rec?.id||null,version_id:rec?.version_id||null,version_name:ver?.version_name||'',key:ver?.score_key||'',page_no:rec?.page_no||i+1,display_name:rec?`${ver?.version_name||''} ${ver?.score_key||''} ${rec.page_no||''}p`:'DB 미등록'};
  });
  return {song_id:String(songId),updated_at:new Date().toISOString(),versions,files,storage_only_count:files.filter(f=>!f.db_id).length};
}
async function saveManifest(songId,manifest){
  const name=manifest?.versions?.[0]?.name || manifest?.versions?.[0]?.version_name || '기본';
  const key=manifest?.versions?.[0]?.key || manifest?.versions?.[0]?.score_key || selectedSong()?.key || '';
  const v=await getOrCreateVersion(songId,name,key);
  for(const [i,f] of (manifest.files||[]).entries()){
    await insertScoreRecord(songId,v.id,f.storage_path,f.page_no||i+1,null);
  }
}
function ensureVersion(manifest,name,key){
  name=(name||'기본').trim();key=(key||'').trim();
  let v=(manifest.versions||[]).find(x=>String(x.name||'')===name && String(x.key||'')===key);
  if(!v){v={id:versionId(),name,key,created_at:new Date().toISOString()};manifest.versions=manifest.versions||[];manifest.versions.push(v)}
  return v;
}
async function scan(){const btn=document.getElementById('scanBtn');btn.disabled=true;document.getElementById('log').textContent='📋 곡 목록 불러오는 중...';try{songs=await rest('songs?select=id,name,key,bpm,bpm_min,bpm_max,status,has_score,score_version&order=name&limit=3000');for(const s of songs){const files=await listStorageRecursive(String(s.id).replace(/\/+$/,'')+'/');s._score_count=files.length;s._version_groups=[...new Set(files.map(f=>String(f.storage_path).split('/')[1]||'root'))].length;}log(`✅ ${songs.length}곡 불러옴`);renderSongList();}catch(e){log('✗ 오류: '+e.message)}btn.disabled=false}
function renderSongList(){const q=norm(document.getElementById('q').value);const mode=document.getElementById('mode').value;const showDone=!!document.getElementById('showDone')?.checked;let rows=songs.filter(s=>!q||norm(s.name).includes(q));if(mode==='withScore')rows=rows.filter(s=>s._score_count>0||s.has_score);if(mode==='multi')rows=rows.filter(s=>(s._score_count||0)>1 || (s._version_groups||0)>1);if(!showDone)rows=rows.filter(s=>!isDoneSong(s.id));const box=document.getElementById('songList');if(!rows.length){box.innerHTML='<div class="empty">표시할 곡이 없습니다.<br>정리 완료한 곡까지 보려면 “완료곡 보기”를 켜주세요.</div>';return}box.innerHTML=rows.map(s=>{const done=isDoneSong(s.id);return `<div class="song-row ${String(s.id)===String(selectedId)?'active':''} ${done?'done':''}" onclick="selectSong('${esc(String(s.id))}')"><div class="song-title">${esc(s.name)}</div><div class="meta">ID ${esc(s.id)} · Key ${esc(s.key||'-')} · 악보 ${s._score_count||0}개 · 그룹 ${s._version_groups||0}</div>${done?'<span class="pill good">정리 완료</span>':((s._score_count||0)>1?'<span class="pill warn">정리 필요</span>':'')}${s.score_version?`<span class="pill">${esc(s.score_version)}</span>`:''}</div>`}).join('')}
async function selectSong(id){selectedId=String(id);renderSongList();await renderSelected()}
function selectedSong(){return songs.find(s=>String(s.id)===String(selectedId))}
async function renderSelected(){const s=selectedSong();if(!s){document.getElementById('detail').innerHTML='<div class="empty">곡을 선택해주세요.</div>';return}document.getElementById('detail').innerHTML='<div class="empty">악보와 DB 기록 불러오는 중...</div>';selectedFiles=await listStorageRecursive(String(s.id).replace(/\/+$/,'')+'/');selectedManifest=await loadManifest(s.id);document.getElementById('detail').innerHTML=detailHtml(s);}
function detailHtml(s){const bpm=s.bpm_min||s.bpm_max?`${s.bpm_min||''}${s.bpm_max&&s.bpm_max!==s.bpm_min?'~'+s.bpm_max:''}`:(s.bpm||'-');return `<div class="box-title">${esc(s.name)}</div><div class="meta">ID ${esc(s.id)} · Key ${esc(s.key||'-')} · BPM ${esc(bpm)} · Storage 파일명은 숫자/영문 유지</div><div style="display:flex;gap:6px;flex-wrap:wrap;margin:10px 0"><button class="good" onclick="writeManifestFromCurrent()">현재 파일을 DB 기록으로 정리</button><button class="warn" onclick="normalizeSelectedSong()">이 곡 파일 정리 실행</button><button onclick="downloadManifest()">DB 기록 내보내기</button><button class="good" onclick="markCurrentDone()">정리 완료 처리</button><button onclick="unmarkCurrentDone()">완료 표시 해제</button></div><div class="panel"><div class="box-title">선택 파일 이동/버전 지정</div><div class="form-grid"><input id="targetSongQuery" placeholder="이동 대상 곡 검색" oninput="renderTargetOptions()"><select id="targetSong"></select><input id="targetKey" placeholder="악보 Key, 예: A"></div><div class="form-grid" style="margin-top:8px"><input id="targetVersion" placeholder="버전명, 예: 전주1 / 전주2 / 기본"><input id="targetPage" type="number" min="1" value="1" placeholder="페이지 번호"><button class="primary" onclick="moveCheckedFiles()">선택 악보 이동/정리</button></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><button class="danger" onclick="deleteCheckedFiles()">선택 악보 삭제</button><button onclick="writeManifestFromCurrent()">현재 곡 DB 기록 정리</button></div><p>파일명은 한글로 바꾸지 않고 <b>songId/versionId/1776703925124_0.png</b> 형식의 안전한 이름으로 저장합니다. 의미 정보는 DB에 기록됩니다.</p></div>${selectedFiles.length?`<div class="files">${selectedFiles.map((f,i)=>fileHtml(f,i)).join('')}</div>`:'<div class="empty">이 곡에는 Storage 악보 이미지가 없습니다.</div>'}<div class="panel danger-zone"><div class="box-title">DB 악보 기록 상태</div><pre style="white-space:pre-wrap;font-size:11px;color:#cbd5e1;max-height:260px;overflow:auto">${esc(JSON.stringify(selectedManifest,null,2))}</pre></div>`}
function fileHtml(f,i){const url=publicUrl(f.storage_path);const meta=(selectedManifest.files||[]).find(x=>x.storage_path===f.storage_path)||{};return `<div class="file"><div class="thumb"><img src="${url}" loading="lazy" onerror="this.parentElement.textContent='미리보기 실패'"></div><div class="file-body"><label style="display:flex;gap:6px;align-items:center;font-size:12px"><input type="checkbox" class="fileCheck" value="${esc(f.storage_path)}"> 선택</label><div class="file-name">${esc(f.file_name)}</div><div class="file-path">${esc(f.storage_path)}</div><div class="meta">DB: ${esc(meta.version_name||'-')} / ${esc(meta.key||'-')} / p.${esc(meta.page_no||'-')}</div><div class="file-actions"><button onclick="openPreview('${encodeURIComponent(url)}')">보기</button><button class="danger" onclick="deleteOne('${encodeURIComponent(f.storage_path)}')">삭제</button></div></div></div>`}
function renderTargetOptions(){const q=norm(document.getElementById('targetSongQuery').value);let rows=songs.filter(s=>!q||norm(s.name).includes(q)).slice(0,80);if(!rows.some(s=>String(s.id)===String(selectedId))){const cur=selectedSong();if(cur)rows.unshift(cur)}document.getElementById('targetSong').innerHTML=rows.map(s=>`<option value="${esc(s.id)}">${esc(s.name)} / ${esc(s.key||'-')} / ${esc(s.id)}</option>`).join('')}

function markCurrentDone(){const s=selectedSong();if(!s)return;markSongDone(s.id);log(`✓ ${s.name} 정리 완료 표시됨. 다음 목록에서는 기본적으로 숨김 처리됩니다.`);renderSongList();}
function unmarkCurrentDone(){const s=selectedSong();if(!s)return;unmarkSongDone(s.id);log(`↩ ${s.name} 완료 표시 해제됨.`);renderSongList();}

async function writeManifestFromCurrent(){
  const s=selectedSong();if(!s)return;
  const version=prompt('현재 파일들을 어떤 악보 버전으로 기록할까요? 예: 기본 / 전주1 / 전주2',s.score_version||'기본');if(version===null)return;
  const key=prompt('이 악보의 Key를 입력하세요.',s.key||'')||s.key||'';
  try{const v=await getOrCreateVersion(s.id,version,key);let page=1;for(const f of selectedFiles){await insertScoreRecord(s.id,v.id,f.storage_path,page++,null)}await patchSong(s.id,{has_score:selectedFiles.length>0,status:selectedFiles.length>0?'ready':(s.status||'plan')});selectedManifest=await loadManifest(s.id);markSongDone(s.id);log(`✓ ${s.name} DB 기록 정리 완료 · 목록에서 숨김 처리됨`);await renderSelected();renderSongList()}catch(e){log('✗ DB 기록 정리 실패: '+e.message)}
}
async function moveOneFile(oldPath,targetSongId,versionName,key,pageNo){
  const ext=extOf(oldPath);
  const v=await getOrCreateVersion(targetSongId,versionName||'기본',key||'');
  const newPath=`${targetSongId}/versions/${v.id}/${safeFileName(pageNo,ext)}`;
  const blob=await fetchBlob(oldPath);
  await uploadBlob(newPath,blob);
  await deleteStorage(oldPath);
  await deleteScoreRecord(oldPath);
  await insertScoreRecord(targetSongId,v.id,newPath,pageNo,blob.type||null);
  return newPath;
}
async function moveCheckedFiles(){const checked=[...document.querySelectorAll('.fileCheck:checked')].map(x=>x.value);if(!checked.length){alert('이동/정리할 악보를 선택해주세요.');return}const targetSongId=document.getElementById('targetSong').value||selectedId;const key=document.getElementById('targetKey').value.trim()||selectedSong()?.key||'';const version=document.getElementById('targetVersion').value.trim()||'기본';let page=Number(document.getElementById('targetPage').value||1);if(!confirm(`${checked.length}개 악보를 정리할까요?\n\n대상 곡 ID: ${targetSongId}\nKey: ${key}\n버전: ${version}\n\n실제 파일명은 숫자/영문 안전 이름으로 새로 저장됩니다.`))return;try{for(const oldPath of checked){const np=await moveOneFile(oldPath,targetSongId,version,key,page++);log(`✓ 이동/정리: ${oldPath} → ${np}`)}await patchSong(targetSongId,{has_score:true,status:'ready'});markSongDone(selectedId);markSongDone(targetSongId);await refreshSongCounts();await renderSelected();}catch(e){log('✗ 이동 실패: '+e.message)}}
async function normalizeSelectedSong(){const s=selectedSong();if(!s||!selectedFiles.length)return;const version=prompt('이 곡 악보의 버전명을 입력하세요. 예: 기본 / 전주1 / 전주2',s.score_version||'기본');if(version===null)return;const key=prompt('이 악보의 Key를 입력하세요.',s.key||'')||s.key||'';if(!confirm('현재 곡 안의 모든 악보를 안전한 숫자 파일명 + DB 기준으로 정리합니다. 계속할까요?'))return;try{let page=1;for(const f of [...selectedFiles]){await moveOneFile(f.storage_path,s.id,version,key,page++);}await patchSong(s.id,{has_score:true,status:'ready'});markSongDone(s.id);await refreshSongCounts();await renderSelected();log(`✓ ${s.name} 파일 정리 완료 · 목록에서 숨김 처리됨`)}catch(e){log('✗ 정리 실패: '+e.message)}}
async function deleteOne(encodedPath){const path=decodeURIComponent(encodedPath);if(!confirm(`삭제할까요?\n${path}`))return;try{await deleteStorage(path);await deleteScoreRecord(path);const remain=await listStorageRecursive(String(selectedId).replace(/\/+$/,'')+'/');await patchSong(selectedId,{has_score:remain.length>0,status:remain.length>0?'ready':'plan'});if(remain.length<=1)markSongDone(selectedId);await refreshSongCounts();await renderSelected();log('🗑 삭제 완료: '+path)}catch(e){log('✗ 삭제 실패: '+e.message)}}
async function deleteCheckedFiles(){
  const checked=[...document.querySelectorAll('.fileCheck:checked')].map(x=>x.value);
  if(!checked.length){alert('삭제할 악보를 선택해주세요.');return}
  if(!confirm(`${checked.length}개 악보를 실제 Storage에서 삭제하고 DB 기록도 지울까요?\n\n삭제 후 되돌릴 수 없습니다.`))return;
  try{
    for(const path of checked){await deleteStorage(path);await deleteScoreRecord(path);log('🗑 삭제 완료: '+path)}
    const remain=await listStorageRecursive(String(selectedId).replace(/\/+$/,'')+'/');
    await patchSong(selectedId,{has_score:remain.length>0,status:remain.length>0?'ready':'plan'});
    if(remain.length<=1)markSongDone(selectedId);
    await refreshSongCounts();await renderSelected();
  }catch(e){log('✗ 선택 삭제 실패: '+e.message)}
}
async function refreshSongCounts(){for(const s of songs){if(String(s.id)===String(selectedId)){const files=await listStorageRecursive(String(s.id).replace(/\/+$/,'')+'/');s._score_count=files.length;s._version_groups=[...new Set(files.map(f=>String(f.storage_path).split('/')[1]||'root'))].length;s.has_score=files.length>0;}}renderSongList()}
function downloadManifest(){const s=selectedSong();if(!s||!selectedManifest)return;const blob=new Blob([JSON.stringify(selectedManifest,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`score_manifest_${s.id}.json`;a.click();URL.revokeObjectURL(a.href)}
function openPreview(u){document.getElementById('previewImg').src=decodeURIComponent(u);document.getElementById('preview').classList.add('show')}
function closePreview(){document.getElementById('preview').classList.remove('show');document.getElementById('previewImg').src=''}
setTimeout(()=>{renderTargetOptions()},300);
</script>
