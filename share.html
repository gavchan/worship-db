<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>콘티 공유</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1020;--card:#121a2d;--line:rgba(255,255,255,.12);--text:#f8fafc;--muted:#9ca3af;--accent:#93c5fd;--white:#fff;--warn:#fca5a5}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:radial-gradient(circle at 20% 0%,rgba(147,197,253,.16),transparent 36%),var(--bg);color:var(--text);min-height:100vh}
.wrap{max-width:920px;margin:0 auto;padding:24px 16px 42px}
.hero{border:1px solid var(--line);background:rgba(255,255,255,.06);border-radius:28px;padding:22px;box-shadow:0 24px 70px rgba(0,0,0,.26);margin-bottom:14px}
.eyebrow{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:6px 11px;color:var(--accent);font-size:12px;font-weight:800}
.hero h1{font-size:30px;letter-spacing:-.04em;margin-top:14px}.hero p{color:var(--muted);font-size:13px;line-height:1.65;margin-top:8px}
.list{display:grid;gap:18px}.song{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:14px;overflow:hidden}.song-head{display:flex;gap:10px;align-items:center}.num{width:34px;height:34px;border-radius:12px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--accent);flex-shrink:0}.name{font-size:17px;font-weight:900;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.pill{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:5px 8px;color:#dbeafe;background:rgba(255,255,255,.045)}.memo{margin-top:9px;color:#d1d5db;font-size:13px;line-height:1.55}
.score-wrap{margin-top:14px;display:grid;gap:12px}.score-title{font-size:13px;font-weight:900;color:var(--accent);display:flex;align-items:center;gap:6px}.score-page{border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.035);overflow:hidden}.score-page-label{padding:8px 10px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted);font-weight:800}.score-page img{display:block;width:100%;height:auto;background:#fff}.pdf-frame{display:block;width:100%;height:78vh;min-height:520px;border:0;background:#fff}.score-empty{border:1px dashed var(--line);border-radius:16px;padding:18px;text-align:center;color:var(--muted);font-size:13px}.score-error{color:var(--warn)}
.empty{border:1px dashed var(--line);border-radius:20px;padding:40px 18px;text-align:center;color:var(--muted)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:18px}.btn{border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--text);border-radius:14px;padding:12px;text-align:center;text-decoration:none;font-weight:900;font-size:14px;cursor:pointer}.btn.primary{background:var(--white);color:#0b1020;border-color:var(--white)}.footer{margin-top:18px;text-align:center;color:var(--muted);font-size:12px;line-height:1.6}.loading{padding:40px;text-align:center;color:var(--muted)}
@media(max-width:520px){.hero h1{font-size:25px}.actions{grid-template-columns:1fr}.pdf-frame{height:70vh;min-height:420px}}
@media print{body{background:#fff;color:#111}.wrap{max-width:none;padding:0}.hero,.song{box-shadow:none;border-color:#ddd;background:#fff;color:#111}.pill{color:#111;border-color:#ddd}.actions,.footer{display:none}.score-page{break-inside:avoid;border-color:#ddd}.score-page-label{color:#555;border-color:#ddd}.pdf-frame{height:100vh}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="eyebrow">📖 Worship DB 공유</div>
    <h1 id="title">콘티</h1>
    <p id="desc">콘티와 악보를 불러오는 중입니다.</p>
  </div>
  <div id="content" class="loading">불러오는 중...</div>
  <div class="actions">
    <button class="btn" onclick="shareThisPage()">💬 카톡/공유</button>
    <a class="btn primary" href="index.html">홈페이지 방문</a>
  </div>
  <div class="footer">공유 페이지는 읽기 전용입니다. 수정과 관리는 홈페이지에서 진행하세요.</div>
</div>
<script>
const SUPABASE_URL='https://rmtysrytveexshwzenxj.supabase.co';
const REAL_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJtdHlzcnl0dmVleHNod3plbnhqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY1MjQ3OTYsImV4cCI6MjA5MjEwMDc5Nn0.5FzzJ1rg-uRG4jAGZ75xVT3i3NH0m6J_tDeOS4GxyT8';
const HEADERS={'Content-Type':'application/json','apikey':REAL_KEY,'Authorization':'Bearer '+REAL_KEY};
const STORAGE_URL=SUPABASE_URL+'/storage/v1';
const STOR_HEADERS={'apikey':REAL_KEY,'Authorization':'Bearer '+REAL_KEY};
let shareTitle='콘티';
function esc(s){return String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function norm(v){return (v||'').normalize('NFC').replace(/\s+/g,' ').trim().toLowerCase()}
function parseLocalDate(value){const [y,m,d]=String(value||'').split('-').map(Number);return y&&m&&d?new Date(y,m-1,d):new Date(value)}
function weekBoundsFor(date=new Date()){const base=new Date(date.getFullYear(),date.getMonth(),date.getDate());const day=base.getDay();const mondayOffset=day===0?-6:1-day;const start=new Date(base);start.setDate(base.getDate()+mondayOffset);start.setHours(0,0,0,0);const end=new Date(start);end.setDate(start.getDate()+6);end.setHours(23,59,59,999);return {start,end}}
function dateTitle(value){const d=parseLocalDate(value);return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 콘티`}
async function api(path){const res=await fetch(SUPABASE_URL+'/rest/v1/'+path,{headers:HEADERS});if(!res.ok)throw new Error(await res.text());return await res.json()}
async function listScores(songId){if(!songId)return[];const res=await fetch(`${STORAGE_URL}/object/list/scores`,{method:'POST',headers:{...STOR_HEADERS,'Content-Type':'application/json'},body:JSON.stringify({prefix:songId+'/',limit:100})});if(!res.ok)return[];const files=await res.json();return (files||[]).filter(f=>f&&f.name&&!f.name.endsWith('/')).sort((a,b)=>String(a.name).localeCompare(String(b.name),'ko',{numeric:true}))}
function scoreUrl(path){return `${STORAGE_URL}/object/public/scores/${encodeURI(path)}`}
function contiStoreKey(h){return 'worshipdb_conti_overrides_'+(h?.id||h?.worship_date||'draft')}
function contiSongOverrideKey(song,i){const id=song?._base_id||song?.id;return id?`song:${id}:pos:${i}`:`name:${norm(song?.name||'')}:pos:${i}`}
function getContiOverrides(h){try{return JSON.parse(localStorage.getItem(contiStoreKey(h))||'{}')}catch(e){return {}}}
function applyOverride(h,s,i){const overrides=getContiOverrides(h);const base={...s,_base_id:s.id||null};const key=contiSongOverrideKey(base,i);return {...base,...(overrides[key]||overrides[i]||{})}}
function isImageFile(name){return /\.(jpe?g|png|webp|gif|bmp)$/i.test(name||'')}
function isPdfFile(name){return /\.pdf$/i.test(name||'')}
function renderScoreFile(songId,file,index){const path=songId+'/'+file.name;const url=scoreUrl(path);const safeName=esc(file.name);if(isImageFile(file.name)){return `<div class="score-page"><div class="score-page-label">${index+1}페이지 · ${safeName}</div><img src="${url}" alt="악보 ${index+1}페이지" loading="lazy"></div>`}if(isPdfFile(file.name)){return `<div class="score-page"><div class="score-page-label">PDF 악보 · ${safeName}</div><iframe class="pdf-frame" src="${url}#toolbar=0" title="PDF 악보"></iframe></div>`}return `<div class="score-page"><div class="score-page-label">파일 · ${safeName}</div><div class="score-empty">이 파일은 바로 미리보기가 어려울 수 있습니다.<br><a class="btn" style="display:inline-block;margin-top:10px" href="${url}" target="_blank" rel="noopener">파일 열기</a></div></div>`}
async function renderScoresForSong(songId){if(!songId)return '<div class="score-empty">악보를 불러올 곡 ID가 없습니다.</div>';try{const files=await listScores(songId);if(!files.length)return '<div class="score-empty">악보 없음</div>';return `<div class="score-wrap"><div class="score-title">🎼 악보 ${files.length}개</div>${files.map((f,i)=>renderScoreFile(songId,f,i)).join('')}</div>`}catch(e){return `<div class="score-empty score-error">악보를 불러오지 못했습니다.<br>${esc(e.message||e)}</div>`}}
async function load(){
  const params=new URLSearchParams(location.search);const id=params.get('id');
  try{
    let rows=[];
    if(id) rows=await api(`worship_history?id=eq.${encodeURIComponent(id)}&select=*`);
    if(!rows.length){const all=await api('worship_history?select=*&order=worship_date.desc&limit=50');const {start,end}=weekBoundsFor(new Date());rows=[all.find(h=>{const d=parseLocalDate(h.worship_date);return d>=start&&d<=end})||all[0]].filter(Boolean)}
    if(!rows.length){document.getElementById('content').innerHTML='<div class="empty">공유할 콘티가 없습니다.</div>';document.getElementById('desc').textContent='콘티가 아직 등록되지 않았습니다.';return}
    const h=rows[0]; shareTitle=dateTitle(h.worship_date);document.title=shareTitle;document.getElementById('title').textContent=shareTitle;document.getElementById('desc').textContent=h.note||'찬양 순서와 악보를 확인할 수 있는 공유용 페이지입니다.';
    const ids=(h.song_ids||[]).filter(Boolean);let songMap={};
    if(ids.length){try{const detail=await api(`songs?id=in.(${ids.map(encodeURIComponent).join(',')})&select=id,name,key,bpm,memo,music_url,has_score,seasons`);detail.forEach(s=>songMap[s.id]=s)}catch(e){}}
    const names=h.song_names||[];const content=document.getElementById('content');content.className='list';
    if(!names.length){content.innerHTML='<div class="empty">등록된 곡이 없습니다.</div>';return}
    content.innerHTML=names.map((name,i)=>`<div class="song" id="song-${i}"><div class="song-head"><div class="num">${i+1}</div><div class="name">${esc(name)}</div></div><div class="loading">악보를 불러오는 중...</div></div>`).join('');
    for(let i=0;i<names.length;i++){
      const raw=songMap[(h.song_ids||[])[i]]||{id:(h.song_ids||[])[i]||'',name:names[i]};const s=applyOverride(h,raw,i);const key=s.key||'';const bpm=s.bpm||'';const memo=s.memo||s.note||'';const songEl=document.getElementById('song-'+i);const scores=await renderScoresForSong(s.id);
      songEl.innerHTML=`<div class="song-head"><div class="num">${i+1}</div><div class="name">${esc(names[i]||s.name)}</div></div><div class="meta">${key?`<span class="pill">Key ${esc(key)}</span>`:''}${bpm?`<span class="pill">BPM ${esc(bpm)}</span>`:''}${s.score_version?`<span class="pill">악보버전 ${esc(s.score_version)}</span>`:''}${s.music_url?'<span class="pill">영상 있음</span>':''}</div>${memo?`<div class="memo">${esc(memo)}</div>`:''}${scores}`;
    }
  }catch(e){document.getElementById('content').innerHTML='<div class="empty">콘티를 불러오지 못했습니다.<br>'+esc(e.message)+'</div>';}
}
async function shareThisPage(){const url=location.href;try{if(navigator.share){await navigator.share({title:shareTitle,text:shareTitle,url});return}}catch(e){}try{await navigator.clipboard.writeText(url);alert('공유 링크를 복사했습니다. 카톡에 붙여넣어 보내세요.')}catch(e){prompt('이 링크를 복사해서 공유하세요',url)}}
load();
</script>
</body>
</html>
