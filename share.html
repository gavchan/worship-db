async function prevSong(){if(selectedIdx>0)await selectSong(selectedIdx-1);else viewerToast('첫 곡입니다')}
async function nextSong(){if(selectedIdx<shareSongs.length-1)await selectSong(selectedIdx+1);else viewerToast('마지막 곡입니다')}
function openSelectedYoutube(){const s=shareSongs[selectedIdx]||{};if(s.conti_url||s.music_url){renderDetail('video');return}viewerToast('등록된 유튜브 링크가 없습니다')}
function visitHome(){location.href='test-main.html'}
function goBackFromShare(){if(history.length>1)history.back();else location.href='test-main.html'}
function viewerToast(msg){const t=document.getElementById('viewer-toast');if(!t)return;t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1400)}
async function openSingleScore(i){singleViewer=true;viewerMode=1;await openSharePerformance(i)}
async function openSharePerformance(i=0){
  normalizeShareSongList();
  if(!shareSongs.length){viewerToast('콘티 곡이 없습니다');return}
  viewerIdx=Math.max(0,Math.min(i,shareSongs.length-1));viewerPage=0;singleViewer=!!singleViewer;
  const v=document.getElementById('share-viewer');v.classList.add('show');v.classList.toggle('single',singleViewer);await requestShareWakeLock(false);await renderShareViewer();singleViewer=false;
}
async function goShareSong(i){normalizeShareSongList();viewerIdx=Math.max(0,Math.min(i,shareSongs.length-1));viewerPage=0;await renderShareViewer()}
async function setSharePageMode(mode){viewerMode=mode===2?2:1;await renderShareViewerBody()}
async function renderShareViewer(){normalizeShareSongList();const s=shareSongs[viewerIdx];viewerFiles=s?.id?await listScores(s.id):[];viewerPage=Math.max(0,Math.min(viewerPage,Math.max(0,viewerFiles.length-1)));await renderShareViewerBody()}
async function buildShareSpreadPages(song,files,page,mode){
  const pageCount=files?.length||0;
  if(!pageCount){return [`<div class="viewer-page empty">악보 업로드 예정<small>${esc(song?.name||'곡')} 악보가 준비되면 여기에 표시됩니다.</small></div>`]}
  const pages=[];
  const currentFile=files[page];
  if(currentFile){pages.push(`<div class="viewer-page"><img src="${scoreUrl(scorePath(song.id,currentFile))}" alt="${esc(song.name||'악보')} ${page+1}" onerror="brokenScoreImage(this)"></div>`)}
  else{pages.push(`<div class="viewer-page empty">악보 페이지 없음<small>${esc(song?.name||'곡')}</small></div>`)}
  if(mode!==2) return pages;
  const nextFile=files[page+1];
  if(nextFile){pages.push(`<div class="viewer-page"><img src="${scoreUrl(scorePath(song.id,nextFile))}" alt="${esc(song.name||'악보')} ${page+2}" onerror="brokenScoreImage(this)"></div>`);return pages;}
  const nextSong=shareSongs[viewerIdx+1];
  if(nextSong?.id){
    const nextFiles=await listScores(nextSong.id);
    const firstNext=nextFiles?.[0];
    if(firstNext){pages.push(`<div class="viewer-page next-song-page"><div class="next-song-label">다음곡 · ${esc(nextSong.name||'곡')}</div><img src="${scoreUrl(scorePath(nextSong.id,firstNext))}" alt="${esc(nextSong.name||'다음곡')} 악보 1" onerror="brokenScoreImage(this)"></div>`);return pages;}
  }
  // 마지막 페이지에서 오른쪽 빈 안내칸을 만들지 않는다.
  // 2페이지 모드라도 짝 페이지가 없으면 현재 악보를 1페이지 크기로 보여준다.
  return pages;
}
async function renderShareViewerBody(){
  normalizeShareSongList();
  const s=shareSongs[viewerIdx]||{};
  const v=document.getElementById('share-viewer');
  const stage=document.getElementById('share-viewer-stage');
  if(!v||!stage){viewerToast('연주화면을 열 수 없습니다');return}
  const pages=await buildShareSpreadPages(s,viewerFiles,viewerPage,viewerMode);
  const effectiveMode=(viewerMode===2 && pages.length<2)?1:viewerMode;
  v.classList.toggle('two',effectiveMode===2);
  v.classList.toggle('one',effectiveMode!==2);
  const strip=shareSongs.map((song,i)=>`<button class="${i===viewerIdx?'on':''}" onclick="goShareSong(${i})">${esc(`${i+1} ${song.name||'곡'}`)}</button>`).join('');
  const memo=songMemo(s);
  const memoStrip=memo?`<div class="share-memo-strip">${esc(memo)}</div>`:'';
  const nextSongCue=(effectiveMode!==2&&!singleViewer&&shareSongs[viewerIdx+1])?`<div class="share-next-cue">다음곡 · ${esc(shareSongs[viewerIdx+1].name||'곡')}</div>`:'';
  stage.innerHTML=`${pages.join('')}<div class="share-top-overlay"><div class="share-top-left"><button class="share-chip ${viewerMode===1?'on':''}" onclick="setSharePageMode(1)">1페이지 보기</button><button class="share-chip ${viewerMode===2?'on':''}" onclick="setSharePageMode(2)">2페이지 보기</button></div><div class="share-top-right"><button class="share-chip close-chip" onclick="closeShareViewer()">×</button></div></div>${nextSongCue}${memoStrip}<div class="share-song-strip">${strip}</div><button class="share-lock ${wakeLock?'on':''}" onclick="toggleShareWakeLock()">화면잠금</button>`;
}
async function closeShareViewer(){
  await requestShareWakeLock(false);
  if(isPerformanceEntry()){
    const ref=document.referrer&&new URL(document.referrer,location.href).origin===location.origin?document.referrer:'test-main.html';
    location.replace(ref);
    return;
  }
  document.getElementById('share-viewer')?.classList.remove('show');
}
async function requestShareWakeLock(on=true){try{if(!on){if(wakeLock){await wakeLock.release();wakeLock=null}return}if('wakeLock' in navigator){wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null;renderShareViewerBody()})}}catch(e){wakeLock=null}}
async function toggleShareWakeLock(){if(wakeLock){await requestShareWakeLock(false);viewerToast('화면잠금 해제')}else{await requestShareWakeLock(true);viewerToast(wakeLock?'화면잠금 켬':'화면잠금 미지원')}await renderShareViewerBody()}
let touchX=0,touchY=0;
document.addEventListener('touchstart',e=>{if(!document.getElementById('share-viewer')?.classList.contains('show'))return;touchX=e.changedTouches[0].clientX;touchY=e.changedTouches[0].clientY},{passive:true});
document.addEventListener('touchend',async e=>{if(!document.getElementById('share-viewer')?.classList.contains('show'))return;const dx=e.changedTouches[0].clientX-touchX;const dy=e.changedTouches[0].clientY-touchY;if(Math.abs(dx)<55||Math.abs(dx)<Math.abs(dy))return;await shareViewerStep(dx<0?1:-1)},{passive:true});
async function shareViewerStep(dir){const step=viewerMode===2?2:1;const max=Math.max(0,viewerFiles.length-1);const next=viewerPage+(dir*step);if(next>max){if(!document.getElementById('share-viewer')?.classList.contains('single')&&viewerIdx<shareSongs.length-1){await goShareSong(viewerIdx+1);return}viewerToast('마지막입니다');return}if(next<0){if(!document.getElementById('share-viewer')?.classList.contains('single')&&viewerIdx>0){await goShareSong(viewerIdx-1);const files=viewerFiles;viewerPage=Math.max(0,files.length-step);await renderShareViewerBody();return}viewerToast('첫 페이지입니다');return}viewerPage=next;await renderShareViewerBody()}
function sharePreviewUrl(){const url=new URL('/api/share-preview',location.origin);if(shareHistoryId)url.searchParams.set('id',shareHistoryId);const conti=activeVariant===1?'2':'1';url.searchParams.set('conti',conti);return url.href}
async function shareThisPage(){const url=sharePreviewUrl();try{if(navigator.share){await navigator.share({title:shareTitle,text:shareTitle,url});return}}catch(e){}try{await navigator.clipboard.writeText(url);alert('공유 링크를 복사했습니다. 카톡에 붙여넣어 보내세요.')}catch(e){prompt('이 링크를 복사해서 공유하세요',url)}}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeShareViewer()});
document.addEventListener('error',function(e){if(e.target&&e.target.tagName==='IMG'&&String(e.target.src||'').includes('/storage/v1/object/public/scores/'))brokenScoreImage(e.target);},true);
document.addEventListener('DOMContentLoaded',()=>{try{load()}catch(e){document.getElementById('content').innerHTML='<div class="empty">공유 페이지를 불러오지 못했습니다.</div>'}});
</script>

<script>
// Phase 38: prevent external popups/new tabs in worship UI
document.addEventListener('click',function(e){
  const a=e.target.closest&&e.target.closest('a[data-blocked-target]');
  if(a){e.preventDefault();alert('새창 열기는 막아두었습니다. 현재 화면 안에서만 표시합니다.');}
},true);
</script>
