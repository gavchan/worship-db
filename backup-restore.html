<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="admin-guard.js"></script>
<title>Worship DB 백업 / 복원</title>
<style>
:root{--bg:#f8fafc;--surface:#fff;--text:#0f172a;--muted:#64748b;--border:#e2e8f0;--blue:#2563eb;--green:#16a34a;--red:#dc2626;--amber:#d97706}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:'Noto Sans KR',system-ui,-apple-system,sans-serif}.wrap{max-width:980px;margin:0 auto;padding:24px}.head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px}.eyebrow{font-size:12px;color:var(--muted);font-weight:800;letter-spacing:.06em}h1{margin:4px 0 6px;font-size:26px}p{margin:0;color:var(--muted);line-height:1.55}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:18px;box-shadow:0 10px 30px rgba(15,23,42,.05)}h2{margin:0 0 10px;font-size:18px}.btn{border:0;border-radius:12px;padding:12px 14px;font-weight:800;cursor:pointer;background:var(--blue);color:white}.btn.green{background:var(--green)}.btn.red{background:var(--red)}.btn.gray{background:#334155}.btn:disabled{opacity:.45;cursor:not-allowed}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.box{background:#f1f5f9;border:1px solid var(--border);border-radius:12px;padding:12px;color:#334155;font-size:13px;line-height:1.55;white-space:pre-wrap}.log{margin-top:14px;max-height:320px;overflow:auto;background:#020617;color:#dbeafe;border-radius:12px;padding:12px;font-family:ui-monospace,Menlo,monospace;font-size:12px;line-height:1.5}.file{width:100%;border:1px dashed var(--border);border-radius:12px;background:#fff;padding:12px}.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.stat div{background:#f8fafc;border:1px solid var(--border);border-radius:12px;padding:10px}.stat b{display:block;font-size:20px}.stat span{font-size:12px;color:var(--muted)}label{font-size:13px;font-weight:800;display:block;margin:10px 0 6px}.warn{border-color:#fed7aa;background:#fffbeb;color:#92400e}@media(max-width:760px){.grid{grid-template-columns:1fr}.wrap{padding:14px}.stat{grid-template-columns:repeat(2,1fr)}}



</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div><div class="eyebrow">WORSHIP DB SAFETY</div><h1>백업 / 복원</h1><p>관리 작업 전에 먼저 실행합니다. 찬양곡, 콘티, 악보 버전/연결 기록을 JSON으로 저장합니다.</p></div>
    <button class="btn gray" onclick="location.href='pc.html'">PC 화면</button>
  </div>
  <div class="grid">
    <section class="card">
      <h2>📦 JSON 백업</h2>
      <div class="box">1차 백업은 DB 데이터 중심입니다. 악보 이미지 파일은 포함하지 않습니다.\nSupabase 이전이나 실수 삭제 대비용으로 주기적으로 저장해두면 좋아요.</div>
      <div class="stat" id="backup-stat"><div><b>-</b><span>찬양곡</span></div><div><b>-</b><span>주일기록</span></div><div><b>-</b><span>악보버전</span></div><div><b>-</b><span>악보연결</span></div></div>
      <div class="row"><button class="btn" onclick="loadStats()">상태 새로고침</button><button class="btn green" onclick="exportBackup()">JSON 내보내기</button></div>
    </section>
    <section class="card">
      <h2>♻️ JSON 복원</h2>
      <div class="box warn">복원은 기존 데이터를 지우지 않고 추가하는 방식입니다.\n운영 중에는 새 사이트로 이전하거나 큰 실수 복구가 필요할 때만 사용하세요.</div>
      <label>백업 JSON 파일</label>
      <input class="file" id="restore-file" type="file" accept="application/json">
      <div class="row"><button class="btn green" onclick="importBackup()">JSON 가져오기</button></div>
    </section>
  </div>
  <div class="log" id="log">준비됨.</div>
</div>
<script>
const SUPABASE_URL = 'https://rmtysrytveexshwzenxj.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJtdHlzcnl0dmVleHNod3plbnhqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY1MjQ3OTYsImV4cCI6MjA5MjEwMDc5Nn0.5FzzJ1rg-uRG4jAGZ75xVT3i3NH0m6J_tDeOS4GxyT8';
const HEADERS = {'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Prefer':'return=representation'};
const logEl = () => document.getElementById('log');
function log(msg) { logEl().textContent += '\n' + msg; logEl().scrollTop = logEl().scrollHeight; }
async function api(method, path, body) {
  const res = await fetch(SUPABASE_URL + '/rest/v1/' + path, { method, headers: HEADERS, body: body ? JSON.stringify(body) : undefined });
  if (!res.ok) throw new Error(await res.text());
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}
function uniqByName(list) { const seen = new Set(); return (list||[]).filter(x=>{ const k=(x.name||'').trim(); if(!k || seen.has(k)) return false; seen.add(k); return true; }); }
async function safeGet(path) { try { return await api('GET', path); } catch(e) { log('읽기 실패: '+path+' / '+e.message); return []; } }
async function loadStats() {
  logEl().textContent = '상태 확인 중...';
  const songs = await safeGet('songs?select=id&limit=5000');
  const history = await safeGet('worship_history?select=id&limit=5000');
  const versions = await safeGet('song_score_versions?select=id&limit=10000');
  const files = await safeGet('song_score_files?select=id&limit=10000');
  document.getElementById('backup-stat').innerHTML = `<div><b>${songs.length}</b><span>찬양곡</span></div><div><b>${history.length}</b><span>주일기록</span></div><div><b>${versions.length}</b><span>악보버전</span></div><div><b>${files.length}</b><span>악보연결</span></div>`;
  log('상태 확인 완료.');
}
async function exportBackup() {
  logEl().textContent = '백업 생성 중...';
  const backup = {
    meta: { app:'worship-db', version:'step9-pc-tools', exported_at:new Date().toISOString() },
    songs: await safeGet('songs?select=*'),
    worship_history: await safeGet('worship_history?select=*'),
    song_score_versions: await safeGet('song_score_versions?select=*'),
    song_score_files: await safeGet('song_score_files?select=*'),
    current_conti: JSON.parse(localStorage.getItem('currentConti') || '[]'),
    ai_settings: JSON.parse(localStorage.getItem('worshipAiSettings') || '{}'),
    worship_ai_settings: JSON.parse(localStorage.getItem('worship_ai_settings') || '{}')
  };
  const blob = new Blob([JSON.stringify(backup,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `worship-db-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  log(`백업 완료: 찬양곡 ${backup.songs.length}곡, 주일기록 ${backup.worship_history.length}개, 악보 연결 ${backup.song_score_files.length}개`);
}
async function importBackup() {
  const file = document.getElementById('restore-file').files[0];
  if(!file) return alert('복원할 JSON 파일을 선택해주세요.');
  if(!confirm('기존 데이터는 지우지 않고 추가합니다. 복원을 진행할까요?')) return;
  logEl().textContent = '복원 파일 읽는 중...';
  const backup = JSON.parse(await file.text());
  const existing = await safeGet('songs?select=name&limit=5000');
  const exists = new Set(existing.map(s=>(s.name||'').trim()));
  const songs = uniqByName(backup.songs || []).filter(s=>!exists.has((s.name||'').trim())).map(s=>{ const x={...s}; delete x.id; delete x.created_at; delete x.updated_at; return x; });
  if(songs.length) { log(`찬양곡 ${songs.length}곡 추가 중...`); await api('POST','songs',songs); } else log('추가할 새 찬양곡 없음.');
  const histories = (backup.worship_history || []).map(h=>{ const x={...h}; delete x.id; delete x.created_at; delete x.updated_at; return x; });
  if(histories.length) { log(`주일 기록 ${histories.length}개 추가 중...`); await api('POST','worship_history',histories); } else log('추가할 주일 기록 없음.');
  if(Array.isArray(backup.current_conti)) localStorage.setItem('currentConti', JSON.stringify(backup.current_conti));
  if(backup.ai_settings) localStorage.setItem('worshipAiSettings', JSON.stringify(backup.ai_settings));
  if(backup.worship_ai_settings) localStorage.setItem('worship_ai_settings', JSON.stringify(backup.worship_ai_settings));
  if(backup.song_score_versions?.length || backup.song_score_files?.length) log('악보 버전/연결 기록은 백업에 포함되어 있습니다. 복원은 중복 위험 때문에 필요 시 별도 점검 후 진행하세요.');
  log('복원 완료. PC 화면을 새로고침하면 반영됩니다.');
  alert('복원이 완료되었습니다.');
}
loadStats();
</script>

</body>
</html>
