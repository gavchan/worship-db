<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>악보 버전 관리</title>
<style>
:root{--bg:#0b1020;--card:#12192d;--line:rgba(255,255,255,.12);--muted:#9aa3b8;--text:#f7f8fb;--white:#fff;--danger:#ff6b6b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif}.wrap{max-width:1180px;margin:0 auto;padding:20px}.top{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin-bottom:16px}.badge{display:inline-flex;border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:999px;padding:6px 10px;font-size:12px;color:#dce4ff}h1{font-size:28px;margin:10px 0 5px}p{color:var(--muted);font-size:13px;line-height:1.55}.grid{display:grid;grid-template-columns:290px 1fr;gap:14px}.card{border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:20px;padding:14px}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}.song-list{display:grid;gap:6px;max-height:72vh;overflow:auto;padding-right:4px}.song{border:1px solid rgba(255,255,255,.08);background:var(--card);border-radius:12px;padding:10px;color:white;text-align:left;cursor:pointer}.song.on{background:white;color:#08101e}.song small{display:block;color:var(--muted);margin-top:3px}.song.on small{color:#4b5563}input,select,textarea{width:100%;border:1px solid var(--line);background:rgba(255,255,255,.06);color:white;border-radius:11px;padding:10px;font-size:13px;outline:none}option{color:#111}button{border:1px solid var(--line);background:rgba(255,255,255,.06);color:white;border-radius:11px;padding:9px 12px;font-size:13px;cursor:pointer}button.primary{background:white;color:#07101f;border-color:white;font-weight:800}button.danger{background:rgba(255,80,80,.12);border-color:rgba(255,80,80,.35);color:#ffd1d1}.versions{display:grid;gap:10px;margin-top:12px}.version{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:12px}.version-head{display:flex;justify-content:space-between;gap:10px}.version h3{font-size:18px;margin:0}.pill{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:4px 7px;font-size:11px;color:#dbe3f6;margin:5px 4px 0 0}.files{display:grid;gap:7px;margin-top:10px}.file{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.035);border-radius:12px;padding:8px}.file span{font-size:12px;color:#dce4ff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.notice{border:1px dashed rgba(255,255,255,.22);border-radius:15px;padding:14px;color:#dce4ff;background:rgba(255,255,255,.035);margin-bottom:12px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(12px);opacity:0;background:white;color:#07101f;border-radius:999px;padding:10px 15px;font-size:13px;font-weight:800;transition:.2s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}@media(max-width:860px){.grid{grid-template-columns:1fr}.song-list{max-height:240px}.top{display:block}.row{display:block}.row>*{margin-bottom:8px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><span class="badge">🎼 Phase 2-B</span><h1>악보 버전 관리</h1><p>한 곡에 여러 Key/악보 버전을 저장하고, 각 버전에 페이지 이미지를 연결합니다.</p></div>
    <div class="row" style="min-width:260px"><button onclick="location.href='pc.html'">PC</button><button onclick="location.href='mobile.html'">모바일</button></div>
  </div>

  <div class="notice" id="schema-notice">DB 확장 테이블을 확인하는 중...</div>

  <div class="grid">
    <div class="card">
      <input id="q" placeholder="곡 검색" oninput="renderSongs()">
      <div class="song-list" id="song-list" style="margin-top:10px"></div>
    </div>
    <div class="card">
      <div id="song-title" style="font-size:22px;font-weight:900;margin-bottom:4px">곡을 선택하세요</div>
      <p id="song-meta">왼쪽에서 곡을 선택하면 버전 목록이 표시됩니다.</p>

      <div class="card" style="margin:12px 0;background:rgba(255,255,255,.035)">
        <h3 style="margin:0 0 10px">새 악보 버전</h3>
        <div class="row">
          <input id="v-name" placeholder="버전명 예: 원키 / 여성키 / 코드버전">
          <select id="v-key"><option value="">Key 선택</option><option>C</option><option>Db</option><option>D</option><option>Eb</option><option>E</option><option>F</option><option>Gb</option><option>G</option><option>Ab</option><option>A</option><option>Bb</option><option>B</option><option>여성키</option><option>남성키</option></select>
          <select id="v-type"><option>코드악보</option><option>밴드악보</option><option>피아노악보</option><option>1페이지</option><option>2페이지</option><option>간단버전</option></select>
        </div>
        <div class="row" style="margin-top:8px">
          <input id="v-bpm-min" type="number" placeholder="BPM 시작 예: 100">
          <input id="v-bpm-max" type="number" placeholder="BPM 끝 예: 115">
          <select id="v-default"><option value="false">대표 아님</option><option value="true">대표 악보</option></select>
        </div>
        <textarea id="v-memo" placeholder="메모" style="margin-top:8px"></textarea>
        <button class="primary" onclick="createVersion()" style="margin-top:8px">버전 추가</button>
      </div>

      <div class="versions" id="versions"></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const SUPABASE_URL='https://rmtysrytveexshwzenxj.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJIUzI1NiIsInJlZiI6InJtdHlzcnl0dmVleHNod3plbnhqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY1MjQ3OTYsImV4cCI6MjA5MjEwMDc5Nn0.5FzzJ1rg-uRG4jAGZ75xVT3i3NH0m6J_tDeOS4GxyT8'.replace('eyJpc3MiOiJIUzI1NiIsInJlZiI','eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI');
const HEADERS={'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+KEY,'Prefer':'return=representation'};
const STOR_HEADERS={'apikey':KEY,'Authorization':'Bearer '+KEY};
const STORAGE_URL=SUPABASE_URL+'/storage/v1';
let songs=[], selected=null, versions=[];
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function norm(s){return String(s||'').normalize('NFC').replace(/\s+/g,' ').trim().toLowerCase()}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1800)}
async function api(method,path,body){const r=await fetch(SUPABASE_URL+'/rest/v1/'+path,{method,headers:HEADERS,body:body?JSON.stringify(body):undefined});if(!r.ok)throw new Error(await r.text());const t=await r.text();return t?JSON.parse(t):null}
async function init(){try{songs=await api('GET','songs?select=*&order=name');document.getElementById('schema-notice').innerHTML='✅ 기존 곡 DB 연결 완료. 확장 테이블 확인 중...';await api('GET','song_score_versions?select=id&limit=1');document.getElementById('schema-notice').innerHTML='✅ 악보 버전관리 테이블이 준비되어 있습니다.';renderSongs()}catch(e){document.getElementById('schema-notice').innerHTML='⚠️ 확장 테이블이 아직 없을 수 있습니다. <b>phase2b_schema.sql</b>을 Supabase SQL Editor에서 먼저 실행하세요.<br><small>'+esc(e.message)+'</small>';renderSongs()}}
function renderSongs(){const q=norm(document.getElementById('q').value);const list=songs.filter(s=>!q||norm(s.name).includes(q)).slice(0,300);document.getElementById('song-list').innerHTML=list.map(s=>`<button class="song ${selected&&selected.id===s.id?'on':''}" onclick="selectSong('${s.id}')"><b>${esc(s.name)}</b><small>${esc(s.key||'Key 미등록')} · 사용 ${s.count||0}회</small></button>`).join('')||'<p>검색 결과 없음</p>'}
async function selectSong(id){selected=songs.find(s=>String(s.id)===String(id));renderSongs();document.getElementById('song-title').textContent=selected.name;document.getElementById('song-meta').textContent=`기본 Key ${selected.key||'-'} · BPM ${selected.bpm||'-'} · 사용 ${selected.count||0}회`;await loadVersions()}
async function loadVersions(){if(!selected)return;const box=document.getElementById('versions');box.innerHTML='<p>불러오는 중...</p>';try{versions=await api('GET',`song_score_versions?select=*&song_id=eq.${selected.id}&order=is_default.desc,created_at.asc`);if(!versions.length){box.innerHTML='<p>아직 등록된 악보 버전이 없습니다. 위에서 새 버전을 추가하세요.</p>';return}let html='';for(const v of versions){let files=[];try{files=await api('GET',`song_score_files?select=*&version_id=eq.${v.id}&order=page_no.asc`)}catch(e){}html+=`<div class="version"><div class="version-head"><div><h3>${esc(v.version_name)} ${v.is_default?'⭐':''}</h3><span class="pill">Key ${esc(v.score_key||'-')}</span><span class="pill">${esc(v.score_type||'-')}</span><span class="pill">BPM ${v.bpm_min||'-'}${v.bpm_max&&v.bpm_max!==v.bpm_min?'~'+v.bpm_max:''}</span></div><div><button onclick="makeDefault('${v.id}')">대표</button> <button class="danger" onclick="deleteVersion('${v.id}')">삭제</button></div></div><p>${esc(v.memo||'')}</p><div class="row"><input type="file" id="file-${v.id}" multiple accept="image/png,image/jpeg,image/jpg,application/pdf"><button class="primary" onclick="uploadFiles('${v.id}','${v.song_id}')">페이지 업로드</button></div><div class="files">${files.map(f=>`<div class="file"><span>${f.page_no}. ${esc(f.file_name)}</span><span><button onclick="window.open('${SUPABASE_URL}/storage/v1/object/public/scores/${encodeURIComponent(f.storage_path).replaceAll('%2F','/')}','_blank')">보기</button> <button class="danger" onclick="deleteFile('${f.id}','${esc(f.storage_path)}')">삭제</button></span></div>`).join('')||'<div class="file"><span>아직 파일 없음</span></div>'}</div></div>`}
box.innerHTML=html}catch(e){box.innerHTML='<div class="notice">확장 테이블이 없어 버전을 불러오지 못했습니다. phase2b_schema.sql을 먼저 실행하세요.<br>'+esc(e.message)+'</div>'}}
async function createVersion(){if(!selected){toast('곡을 먼저 선택하세요');return}const min=Number(document.getElementById('v-bpm-min').value)||null,max=Number(document.getElementById('v-bpm-max').value)||min;const payload={song_id:selected.id,version_name:document.getElementById('v-name').value.trim()||'기본',score_key:document.getElementById('v-key').value,score_type:document.getElementById('v-type').value,bpm_min:min,bpm_max:max,is_default:document.getElementById('v-default').value==='true',memo:document.getElementById('v-memo').value.trim()};try{if(payload.is_default)await api('PATCH',`song_score_versions?song_id=eq.${selected.id}`,{is_default:false});await api('POST','song_score_versions',payload);['v-name','v-bpm-min','v-bpm-max','v-memo'].forEach(id=>document.getElementById(id).value='');toast('버전을 추가했어요');await loadVersions()}catch(e){toast('추가 실패')}}
async function makeDefault(id){const v=versions.find(x=>x.id===id);if(!v)return;await api('PATCH',`song_score_versions?song_id=eq.${v.song_id}`,{is_default:false});await api('PATCH',`song_score_versions?id=eq.${id}`,{is_default:true});toast('대표 악보로 지정했어요');await loadVersions()}
async function deleteVersion(id){if(!confirm('이 악보 버전과 연결 파일 기록을 삭제할까요? Storage 파일은 파일별 삭제를 권장합니다.'))return;await api('DELETE',`song_score_versions?id=eq.${id}`);toast('버전을 삭제했어요');await loadVersions()}
function safeName(name){return name.normalize('NFC').replace(/[^가-힣a-zA-Z0-9._-]+/g,'_')}
async function uploadFiles(versionId,songId){const input=document.getElementById('file-'+versionId);const files=[...(input.files||[])];if(!files.length){toast('파일 선택 필요');return}let existing=[];try{existing=await api('GET',`song_score_files?select=page_no&version_id=eq.${versionId}&order=page_no.desc&limit=1`)}catch(e){}let page=(existing[0]?.page_no||0)+1;for(const file of files){const path=`${songId}/versions/${versionId}/${String(page).padStart(2,'0')}_${safeName(file.name)}`;const res=await fetch(`${STORAGE_URL}/object/scores/${path}`,{method:'POST',headers:{...STOR_HEADERS,'Content-Type':file.type,'x-upsert':'true'},body:file});if(!res.ok){toast('업로드 실패');return}await api('POST','song_score_files',{version_id:versionId,song_id:songId,storage_path:path,file_name:file.name,page_no:page,mime_type:file.type});page++}await api('PATCH',`songs?id=eq.${songId}`,{has_score:true,status:'ready',updated_at:new Date().toISOString()});input.value='';toast('파일 업로드 완료');await loadVersions()}
async function deleteFile(id,path){if(!confirm('이 페이지를 삭제할까요?'))return;await fetch(`${STORAGE_URL}/object/scores`,{method:'DELETE',headers:{...STOR_HEADERS,'Content-Type':'application/json'},body:JSON.stringify({prefixes:[path]})});await api('DELETE',`song_score_files?id=eq.${id}`);toast('삭제 완료');await loadVersions()}
init();
</script>
</body>
</html>
