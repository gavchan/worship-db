<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>예배 자료실</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--gold:#b99545;--gold2:#d7b765;--ink:#07111f;--panel:rgba(5,10,18,.68);--line:rgba(255,255,255,.16);--muted:#c3cad8}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font-family:'Noto Sans KR',system-ui,sans-serif;color:#fff;background:#08111f;overflow-x:hidden}
.page{min-height:100vh;position:relative;background:
  linear-gradient(90deg,rgba(2,6,16,.66) 0%,rgba(3,9,23,.28) 42%,rgba(5,11,23,.42) 100%),
  linear-gradient(180deg,rgba(0,0,0,.08) 0%,rgba(0,0,0,.06) 44%,rgba(0,0,0,.62) 100%),
  url("assets/main-church-bg.png");
  background-size:cover,cover,cover;background-position:center,center,left center}
.stars{position:absolute;inset:0;background:radial-gradient(circle at 84% 72%,rgba(255,166,69,.24),transparent 23%);pointer-events:none}
.top{position:relative;z-index:2;max-width:1280px;margin:0 auto;padding:28px 34px 0;display:flex;justify-content:space-between;align-items:center;gap:20px}
.brand{font-weight:900;letter-spacing:-.03em;font-size:22px;text-shadow:0 2px 14px rgba(0,0,0,.45)}
.nav{display:flex;align-items:center;gap:2px;padding:6px;border:1px solid rgba(255,255,255,.15);border-radius:999px;background:rgba(2,7,18,.32);backdrop-filter:blur(16px)}
.nav a{color:#fff;text-decoration:none;font-size:14px;font-weight:800;padding:10px 16px;border-radius:999px;opacity:.84}
.nav a:hover,.nav a.on{background:rgba(183,146,65,.92);opacity:1}
.hero{position:relative;z-index:2;max-width:1280px;margin:0 auto;padding:94px 34px 44px;display:grid;grid-template-columns:minmax(420px,1fr) 430px;gap:28px;align-items:end;min-height:calc(100vh - 90px)}
.copy{padding-left:min(28vw,420px)}
.eyebrow{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);border-radius:999px;padding:8px 13px;font-size:13px;color:#e7ecf8;backdrop-filter:blur(14px);margin-bottom:18px}
h1{font-size:clamp(42px,4.7vw,76px);line-height:1.02;letter-spacing:-.055em;text-shadow:0 8px 36px rgba(0,0,0,.45);white-space:nowrap;word-break:keep-all}
.lead{margin-top:16px;color:#d9dfeb;font-size:20px;line-height:1.55;font-weight:600;text-shadow:0 4px 24px rgba(0,0,0,.48)}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid rgba(255,255,255,.18);border-radius:999px;background:rgba(5,10,18,.52);color:#fff;text-decoration:none;font-weight:900;padding:13px 18px;backdrop-filter:blur(14px)}
.btn.primary{background:linear-gradient(135deg,var(--gold2),var(--gold));border-color:rgba(255,255,255,.16);color:#111827}
.btn:hover{transform:translateY(-1px)}
.panel-stack{display:grid;gap:14px}
.card{border:1px solid var(--line);border-radius:22px;background:var(--panel);box-shadow:0 24px 80px rgba(0,0,0,.28);backdrop-filter:blur(18px);overflow:hidden}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid rgba(255,255,255,.1)}
.card-head h2{font-size:24px;letter-spacing:-.04em}
.date{font-size:13px;color:var(--muted);white-space:nowrap}
.conti-list{display:grid;padding:4px 20px 12px}
.song-row{display:grid;grid-template-columns:38px 1fr auto;gap:13px;align-items:center;padding:13px 0;border-bottom:1px solid rgba(255,255,255,.1)}
a.song-row{color:#fff;text-decoration:none}
a.song-row:hover .song-title{text-decoration:underline}
.song-row:last-child{border-bottom:0}
.num{width:34px;height:34px;border-radius:12px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-weight:900}
.song-title{font-size:17px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song-meta{font-size:12px;color:var(--muted);margin-top:2px}
.pill{border:1px solid rgba(255,255,255,.13);border-radius:999px;padding:5px 8px;font-size:12px;color:#e8ecf6;white-space:nowrap}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mini{display:block;text-decoration:none;color:#fff;padding:17px;border:1px solid var(--line);border-radius:19px;background:rgba(5,10,18,.56);backdrop-filter:blur(15px)}
.mini b{display:block;font-size:17px;margin-bottom:5px}
.mini span{display:block;color:var(--muted);font-size:12px;line-height:1.45}
.player{position:relative;z-index:2;border-top:1px solid rgba(255,255,255,.1);background:rgba(1,5,13,.78);backdrop-filter:blur(18px)}
.player-inner{max-width:1280px;margin:0 auto;padding:16px 34px;display:grid;grid-template-columns:260px 1fr auto;gap:22px;align-items:center}
.now b{display:block;font-size:15px}.now span{display:block;font-size:12px;color:var(--muted);margin-top:3px}
.wave{height:42px;border-radius:999px;background:repeating-linear-gradient(90deg,rgba(183,146,65,.35) 0 4px,transparent 4px 12px),linear-gradient(90deg,rgba(183,146,65,.7),rgba(124,58,237,.68),rgba(255,255,255,.2));mask:linear-gradient(#000,#000);opacity:.78}
.more{color:#fff;text-decoration:none;background:#000;border-radius:999px;padding:12px 17px;font-weight:900}
@media(max-width:1180px) and (min-width:721px){
  .hero{grid-template-columns:1fr;align-items:start;padding-top:44vh}
  .copy{padding-left:0;max-width:520px}
  .panel-stack{max-width:620px;margin-top:22px}
  .player-inner{grid-template-columns:1fr}
}
@media(max-width:900px){.nav{display:none}}
@media(max-width:720px){
  body{background:#06101f}
  .page{min-height:100dvh;background:linear-gradient(180deg,#071326 0%,#06101f 58%,#030712 100%)}
  .page:before{content:'';position:absolute;z-index:1;left:16px;right:16px;top:62px;height:210px;border-radius:24px;border:1px solid rgba(255,255,255,.16);background:
    linear-gradient(90deg,rgba(1,5,13,.08),rgba(1,5,13,.58)),
    linear-gradient(180deg,rgba(0,0,0,.04),rgba(0,0,0,.26)),
    url("assets/main-church-bg.png");
    background-size:cover,cover,auto 118%;background-position:center,center,left center;background-repeat:no-repeat;box-shadow:0 22px 70px rgba(0,0,0,.36);overflow:hidden}
  .stars{background:radial-gradient(circle at 72% 30%,rgba(255,166,69,.16),transparent 28%)}
  .top{padding:18px 16px 0}.brand{font-size:18px}
  .hero{padding:282px 16px 28px;min-height:auto;display:block}
  .copy{padding:0}.eyebrow{font-size:12px;padding:7px 11px;margin-bottom:12px}
  h1{font-size:42px;white-space:normal;letter-spacing:-.05em}
  .lead{font-size:16px;line-height:1.55;margin-top:10px;max-width:310px}
  .cta{display:grid;grid-template-columns:1fr;gap:8px;margin-top:18px;max-width:310px}
  .btn{width:100%;padding:12px 15px}
  .panel-stack{margin-top:20px;max-width:none;gap:10px}
  .card{border-radius:18px}.card-head{padding:15px 16px}.card-head h2{font-size:21px}.date{font-size:12px}
  .conti-list{padding:2px 16px 10px}.song-row{grid-template-columns:32px 1fr auto;gap:10px;padding:11px 0}.num{width:30px;height:30px;border-radius:10px}.song-title{font-size:15px}.pill{font-size:11px;padding:4px 7px}
  .quick{grid-template-columns:1fr 1fr;gap:8px}.mini{padding:13px;border-radius:15px}.mini b{font-size:15px}.mini span{font-size:11px}
  .player{display:none}
}
</style>
</head>
<body>
<div class="page">
  <div class="stars"></div>
  <header class="top">
    <div class="brand">예배 자료실</div>
    <nav class="nav">
      <a class="on" href="index.html">홈</a>
      <a href="test-main.html">찬양단</a>
      <a href="test-choir.html">성가대</a>
    </nav>
  </header>
  <main class="hero">
    <section class="copy">
      <div class="eyebrow">✦ 찬양단 · 성가대 통합 입구</div>
      <h1>예배 자료실</h1>
      <p class="lead">찬양단 콘티와 성가대 연습 자료를 같은 테마 안에서 나누어 관리합니다.</p>
      <div class="cta">
        <a class="btn primary" href="test-main.html">찬양단 들어가기</a>
        <a class="btn" href="test-choir.html">성가대 들어가기</a>
      </div>
    </section>
    <section class="panel-stack">
      <div class="card">
        <div class="card-head"><h2>찬양단</h2><span class="date">콘티 · 찬양곡</span></div>
        <div class="conti-list">
          <a class="song-row" href="test-main.html"><div class="num">1</div><div><div class="song-title">주일 찬양콘티</div><div class="song-meta">콘티1·콘티2, 공유, 전체화면 악보</div></div><span class="pill">열기</span></a>
          <a class="song-row" href="test-songs.html"><div class="num">2</div><div><div class="song-title">찬양곡 데이터베이스</div><div class="song-meta">곡 검색, 수정, 악보·영상 관리</div></div><span class="pill">관리</span></a>
        </div>
      </div>
      <div class="card">
        <div class="card-head"><h2>성가대</h2><span class="date">4성부 · 파트별 영상</span></div>
        <div class="conti-list">
          <a class="song-row" href="test-choir.html"><div class="num">1</div><div><div class="song-title">성가대 자료실</div><div class="song-meta">4성부 악보와 파트별 연습 자료</div></div><span class="pill">열기</span></a>
          <a class="song-row" href="choir-upload.html"><div class="num">2</div><div><div class="song-title">성가곡 등록</div><div class="song-meta">PDF/이미지 업로드와 R2 저장</div></div><span class="pill">등록</span></a>
        </div>
      </div>
    </section>
  </main>
</div>
</body>
</html>
