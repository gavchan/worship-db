<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>드림찬양단 예배 시스템</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Noto Sans KR',sans-serif;min-height:100vh;background:#0b1020;color:white;display:flex;align-items:center;justify-content:center;padding:24px;overflow:hidden}.bg:before,.bg:after{content:'';position:fixed;width:520px;height:520px;border-radius:50%;filter:blur(75px);pointer-events:none}.bg:before{left:-130px;top:-160px;background:rgba(99,102,241,.18)}.bg:after{right:-150px;bottom:-180px;background:rgba(14,165,233,.16)}.wrap{position:relative;width:min(960px,100%)}.badge{display:inline-flex;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.07);border-radius:999px;padding:8px 13px;font-size:13px;color:#dce4f8;backdrop-filter:blur(12px)}h1{font-size:48px;line-height:1.12;letter-spacing:-.04em;margin-top:22px}p{color:#a7adbd;margin-top:14px;line-height:1.7}.cards{display:grid;grid-template-columns:repeat(2,minmax(220px,1fr));gap:18px;margin-top:34px}.card{display:block;text-decoration:none;color:white;border:1px solid rgba(255,255,255,.12);border-radius:34px;padding:30px 26px;background:rgba(255,255,255,.065);backdrop-filter:blur(16px);transition:.18s;min-height:210px}.card:hover{transform:translateY(-4px);border-color:rgba(255,255,255,.32);background:rgba(255,255,255,.1)}.card.primary{background:white;color:#050816;border-color:white}.icon{width:70px;height:70px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.12);font-size:34px;margin-bottom:18px}.primary .icon{background:#eef3ff}.card h2{font-size:25px}.card p{font-size:14px;margin-top:11px}.note{font-size:13px;color:#858ca0;margin-top:22px}@media(max-width:760px){body{align-items:flex-start;overflow:auto}.cards{grid-template-columns:1fr}h1{font-size:36px}.card{min-height:auto;border-radius:28px}}
</style>
</head>
<body>
<div class="bg"></div>
<main class="wrap">
  <div class="badge">🌌 드림찬양단 Worship DB</div>
  <h1>예배 준비와 연주를<br>한 흐름으로 연결합니다</h1>
  <p>데스크탑에서는 찬양곡과 주일기록을 정리하고, 연주모드에서는 화면 방향에 맞춰 악보를 바로 사용할 수 있습니다.</p>
  <div class="cards">
    <a class="card primary" href="pc.html"><div class="icon">💻</div><h2>데스크탑 버전</h2><p>찬양곡, 주일기록, 관리도구, 모바일보기를 한곳에서 다루는 메인 작업 공간입니다.</p></a>
    <a class="card" href="mobile.html"><div class="icon">🎼</div><h2>연주모드</h2><p>세로·가로 화면을 자동으로 감지해 실제 예배 연주 흐름에 맞게 악보를 봅니다.</p></a>
  </div>
  <div class="note">실행점검과 백업/복원은 데스크탑 버전의 관리도구 안에서 사용할 수 있습니다.</div>
</main>
</body>
</html>
